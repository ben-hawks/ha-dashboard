- type: custom:auto-entities
  show_empty: false
  card:
    type: grid
    columns: 2
    square: false
  card_param: cards
  filter:
    include:
    - area: chicken_coop
      domain: cover
      options:
        type: tile
        features:
        - type: cover-open-close
    - area: chicken_coop
      domain: lock
      options:
        type: tile
        features:
        - type: lock-commands
    - area: chicken_coop
      domain: light
      options: &id003
        type: tile
        tap_action:
          action: toggle
        hold_action:
          action: more-info
    - area: chicken_coop
      domain: switch
      options: *id003
    exclude:
    - entity_id: '*chicken_cam_*'
    - entity_id: '*chicken_run_*'
    - integration: unifi
  sort:
    method: name
  grid_options:
    columns: full
- type: grid
  columns: 2
  square: false
  grid_options:
    columns: full
  cards:
  - type: custom:mini-graph-card
    hours_to_show: 24
    points_per_hour: 2
    hour24: false
    height: 64
    line_width: 3
    smoothing: true
    animate: false
    font_size: 70
    font_size_header: 12
    show: &id004
      icon: true
      name: true
      state: true
      legend: false
      labels: false
      points: false
      fill: fade
    name: In the coop
    icon: mdi:thermometer
    entities:
    - entity: sensor.coop_temperature
    - entity: sensor.station_temperature
      color: '#a5adc6'
      show_fill: false
      show_state: false
    color_thresholds:
    - value: 20
      color: '#b7d7ff'
    - value: 35
      color: '#6aa9ff'
    - value: 55
      color: '#6fdc8c'
    - value: 75
      color: '#ffb347'
    - value: 90
      color: '#ff6b5e'
    color_thresholds_transition: smooth
  - type: custom:mini-graph-card
    hours_to_show: 24
    points_per_hour: 2
    hour24: false
    height: 64
    line_width: 3
    smoothing: true
    animate: false
    font_size: 70
    font_size_header: 12
    show: *id004
    name: Coop humidity
    icon: mdi:water-percent
    entities:
    - entity: sensor.coop_humidity
      color: '#46d0c0'
    lower_bound: 0
    upper_bound: 100
