# Plants: one card per soil probe, grouped by where they are (Garden: the
# Ecowitt probes outside; Garage: the ESPHome soil sensors). Generated by
# tools/garden.py (BEDS there); its package is packages/garden.yaml, and
# drip watering is packages/drip.yaml.
#
# Each card: tap the plant picture to pick the plant, the title to rename the
# bed, the house/sun icon to say whether it's indoors or outdoors. Dry beds
# raise a Home alert. Phones get the cards one under another (same view).
title: Plants
path: plants
icon: mdi:sprout
type: sections
max_columns: 3

sections:
  - !include garden_section.yaml
