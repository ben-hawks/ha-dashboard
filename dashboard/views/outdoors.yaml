# Outdoors: forecast, Ecowitt WS90 weather station, garden soil probes,
# chicken coop, and the shed. The weather station and Garden sections are
# generated by tools/weather.py and tools/garden.py.
title: Outdoors
path: outdoors
type: sections
theme: Wall Tablet
max_columns: 3
dense_section_placement: true

sections:
  - type: grid
    cards:
      - type: weather-forecast
        entity: weather.forecast_home
        show_current: true
        show_forecast: true
        forecast_type: hourly
        grid_options:
          columns: full

  # Ecowitt WS90: generated by tools/weather.py.
  - !include weather_station_section.yaml

  - !include garden_section.yaml

  # Coop sensors, picked up from the Chicken Coop area so they keep working
  # if their entity IDs change.
  - type: grid
    cards:
      - type: heading
        heading: Chicken coop
        icon: mdi:egg
      - type: custom:auto-entities
        show_empty: false
        grid_options:
          columns: full
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - area: chicken_coop
              domain: sensor
              attributes:
                device_class: temperature
              options: &coop_tile
                type: tile
                features:
                  - type: trend-graph
                    hours_to_show: 24
            - area: chicken_coop
              domain: sensor
              attributes:
                device_class: humidity
              options: *coop_tile
        sort:
          method: name

  # Power station in the shed.
  - type: grid
    cards:
      - type: heading
        heading: Shed power
        icon: mdi:home-battery
      - type: tile
        entity: sensor.el30v22533005590342_battery_level
        name: Battery
        features:
          - type: bar-gauge
      - type: tile
        entity: sensor.el30v22533005590342_battery_time_in_minutes
        name: Time left
        icon: mdi:timer-sand
      - type: tile
        entity: switch.el30v22533005590342_ac
        name: AC outlets
        icon: mdi:power-socket-us
      - type: tile
        entity: switch.el30v22533005590342_dc
        name: DC outlets
        icon: mdi:usb-port
