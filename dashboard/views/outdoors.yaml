# Outdoors, in three full-width bands, top to bottom:
#   Weather       station card | forecast | 24 h graphs  (tools/weather.py)
#   Garden        one card per bed                       (tools/garden.py)
#   Coop & shed   chicken coop sensors | shed power station
# Each band lays its cards out with a grid card, so the columns stay even and
# in the same order on any screen width. Weather and Garden have no headings
# so both fit on the 1280×800 wall tablet without scrolling.
title: Outdoors
path: outdoors
type: sections
max_columns: 3

sections:
  - !include weather_station_section.yaml

  - !include garden_section.yaml

  - type: grid
    column_span: 3
    cards:
      - type: grid
        columns: 2
        square: false
        grid_options:
          columns: full
        cards:
          # Coop sensors, picked up from the Chicken Coop area so they keep
          # working if their entity IDs change.
          - type: vertical-stack
            cards:
              - type: heading
                heading: Chicken coop
                icon: mdi:egg
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: grid
                  columns: 2
                  square: false
                card_param: cards
                filter:
                  include:
                    - area: chicken_coop
                      domain: sensor
                      attributes:
                        device_class: temperature
                      options: &coop_tile
                        type: tile
                        features:
                          - type: trend-graph
                            hours_to_show: 24
                    - area: chicken_coop
                      domain: sensor
                      attributes:
                        device_class: humidity
                      options: *coop_tile
                sort:
                  method: name
                else:
                  type: markdown
                  content: No coop sensors found in the Chicken Coop area.

          # Power station in the shed.
          - type: vertical-stack
            cards:
              - type: heading
                heading: Shed power
                icon: mdi:home-battery
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: tile
                    entity: sensor.el30v22533005590342_battery_level
                    name: Battery
                    features:
                      - type: bar-gauge
                  - type: tile
                    entity: sensor.el30v22533005590342_battery_time_in_minutes
                    name: Time left
                    icon: mdi:timer-sand
                  - type: tile
                    entity: switch.el30v22533005590342_ac
                    name: AC outlets
                    icon: mdi:power-socket-us
                  - type: tile
                    entity: switch.el30v22533005590342_dc
                    name: DC outlets
                    icon: mdi:usb-port
