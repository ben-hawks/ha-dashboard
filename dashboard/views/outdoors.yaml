# Outdoors, in three full-width bands, top to bottom:
#   Weather       station card | forecast | 24 h graphs  (tools/weather.py)
#   Garden        one card per bed                       (tools/garden.py)
#   Coop & shed   chicken coop sensors | shed power station
# Each band lays its cards out with a grid card, so the columns stay even and
# in the same order on any screen width. Weather and Garden have no headings
# so both fit on the 1280×800 wall tablet without scrolling.
title: Outdoors
path: outdoors
type: sections
max_columns: 3

sections:
  - !include weather_station_section.yaml

  - !include garden_section.yaml

  - type: grid
    column_span: 3
    cards:
      - type: grid
        columns: 2
        square: false
        grid_options:
          columns: full
        cards:
          # Coop sensors, picked up from the Chicken Coop area so they keep
          # working if their entity IDs change.
          - type: vertical-stack
            cards:
              - type: heading
                heading: Chicken coop
                icon: mdi:egg
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: grid
                  columns: 2
                  square: false
                card_param: cards
                filter:
                  include:
                    - area: chicken_coop
                      domain: sensor
                      attributes:
                        device_class: temperature
                      options: &coop_tile
                        type: tile
                        features:
                          - type: trend-graph
                            hours_to_show: 24
                    - area: chicken_coop
                      domain: sensor
                      attributes:
                        device_class: humidity
                      options: *coop_tile
                sort:
                  method: name
                else:
                  type: markdown
                  content: No coop sensors found in the Chicken Coop area.

          # Power station in the shed.
          - type: vertical-stack
            cards:
              - type: heading
                heading: Shed power
                icon: mdi:home-battery
              - type: grid
                columns: 2
                square: false
                cards:
                  # Fixed-ID helpers from packages/wall_tablet.yaml.
                  - type: tile
                    entity: sensor.shed_battery
                    name: Battery
                    features:
                      - type: bar-gauge
                  # Time left on battery, and time to a full charge.
                  - type: vertical-stack
                    cards:
                      - type: tile
                        entity: sensor.shed_battery_time_left
                        name: Time left
                      - type: tile
                        entity: sensor.shed_battery_time_to_full
                        name: Full charge in
              # The AC and DC outlet switches (not their _eco mode twins),
              # found by the power station's serial number so a re-added
              # device doesn't break them.
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: grid
                  columns: 2
                  square: false
                card_param: cards
                filter:
                  include:
                    - entity_id: "switch.*el30v22533005590342*_ac"
                      options:
                        type: tile
                        name: AC outlets
                        icon: mdi:power-socket-us
                    - entity_id: "switch.*el30v22533005590342*_dc"
                      options:
                        type: tile
                        name: DC outlets
                        icon: mdi:usb-port
              # Solar coming in, with the last 24 hours behind it.
              - type: tile
                entity: sensor.shed_el30v2_el30v22533005590342_photovoltaics_input_power
                name: Solar input
                color: amber
                features:
                  - type: trend-graph
                    hours_to_show: 24
