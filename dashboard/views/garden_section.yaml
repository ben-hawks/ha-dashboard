# GENERATED by tools/garden.py: edit PLANTS there and re-run it,
# don't edit this file by hand.
type: grid
column_span: 3
cards:
- type: heading
  heading: Garden
  icon: mdi:sprout
- type: vertical-stack
  grid_options:
    columns: 3
  cards:
  - type: picture-elements
    image: data:image/svg+xml;base64,
    elements:
    - type: state-label
      entity: sensor.garden_1_moisture
      style:
        left: 70.7%
        top: 45.0%
        font-size: 34px
        font-weight: '600'
        color: var(--primary-text-color)
    - type: state-label
      entity: sensor.garden_1_status
      style:
        left: 70.7%
        top: 65.0%
        font-size: 13px
        color: var(--secondary-text-color)
    - type: state-label
      entity: sensor.garden_1_soil_temperature
      style:
        left: 56.7%
        top: 87.5%
        font-size: 13px
        color: var(--secondary-text-color)
    - type: state-label
      entity: sensor.garden_1_conductivity
      style:
        left: 83.3%
        top: 87.5%
        font-size: 13px
        color: var(--secondary-text-color)
    - type: conditional
      conditions:
      - entity: sensor.garden_1_status
        state: Dry
      elements:
      - type: icon
        icon: mdi:water-off-outline
        tap_action:
          action: none
        style:
          left: 48.7%
          top: 45.0%
          color: '#e0a03a'
          --mdc-icon-size: 28px
    - type: conditional
      conditions:
      - entity: sensor.garden_1_status
        state: Good
      elements:
      - type: icon
        icon: mdi:water-check
        tap_action:
          action: none
        style:
          left: 48.7%
          top: 45.0%
          color: '#4caf50'
          --mdc-icon-size: 28px
    - type: conditional
      conditions:
      - entity: sensor.garden_1_status
        state: Wet
      elements:
      - type: icon
        icon: mdi:water-alert
        tap_action:
          action: none
        style:
          left: 48.7%
          top: 45.0%
          color: '#3b82f6'
          --mdc-icon-size: 28px
    - type: conditional
      conditions:
      - entity: sensor.garden_1_battery
        state_not:
        - unavailable
        - unknown
      - entity: binary_sensor.garden_1_battery_low
        state: 'on'
      elements:
      - type: icon
        icon: mdi:battery-alert-variant-outline
        title: Probe battery low
        style:
          left: 94.7%
          top: 13.8%
          color: '#e0533d'
          --mdc-icon-size: 22px
  - type: tile
    entity: sensor.garden_1_moisture
    name: Moisture, last 3 days
    icon: mdi:water-percent
    color: blue
    hide_state: true
    features:
    - type: trend-graph
      hours_to_show: 72
