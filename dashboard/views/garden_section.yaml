# GENERATED by tools/garden.py: edit BEDS / PLANT_TYPES there and re-run
# it, don't edit this file by hand.
type: grid
column_span: 3
cards:
- type: grid
  columns: 4
  square: false
  grid_options:
    columns: full
  cards:
  - type: vertical-stack
    cards:
    - type: picture-elements
      image: data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMDAgMTYwIj48L3N2Zz4=
      elements:
      - type: image
        entity: sensor.garden_1_status
        image: data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMDAgMTYwIj48L3N2Zz4=
        state_image: &id002
          Dry: data:image/svg+xml;base64,
          Good: data:image/svg+xml;base64,
          Wet: data:image/svg+xml;base64,
        tap_action:
          action: none
        style: &id001
          left: 50%
          top: 50%
          width: 100%
      - type: image
        entity: sensor.garden_1_level
        image: data:image/svg+xml;base64,
        state_image: &id003
          '0': data:image/svg+xml;base64,
          '1': data:image/svg+xml;base64,
          '2': data:image/svg+xml;base64,
          '3': data:image/svg+xml;base64,
          '4': data:image/svg+xml;base64,
          '5': data:image/svg+xml;base64,
          '6': data:image/svg+xml;base64,
          '7': data:image/svg+xml;base64,
          '8': data:image/svg+xml;base64,
          '9': data:image/svg+xml;base64,
          '10': data:image/svg+xml;base64,
          '11': data:image/svg+xml;base64,
          '12': data:image/svg+xml;base64,
          '13': data:image/svg+xml;base64,
          '14': data:image/svg+xml;base64,
          '15': data:image/svg+xml;base64,
          '16': data:image/svg+xml;base64,
          '17': data:image/svg+xml;base64,
          '18': data:image/svg+xml;base64,
          '19': data:image/svg+xml;base64,
          '20': data:image/svg+xml;base64,
        tap_action:
          action: none
        style: *id001
      - type: image
        entity: input_select.garden_1_plant
        image: data:image/svg+xml;base64,
        state_image: &id005
          Seedling: data:image/svg+xml;base64,
          Lettuce: data:image/svg+xml;base64,
          Tomato: data:image/svg+xml;base64,
          Pepper: data:image/svg+xml;base64,
          Carrot: data:image/svg+xml;base64,
          Herbs: data:image/svg+xml;base64,
          Cucumber: data:image/svg+xml;base64,
          Strawberry: data:image/svg+xml;base64,
          Blueberry: data:image/svg+xml;base64,
          Raspberry: data:image/svg+xml;base64,
          Sunflower: data:image/svg+xml;base64,
          Flowers: data:image/svg+xml;base64,
          Succulent: data:image/svg+xml;base64,
        tap_action:
          action: more-info
        style: *id001
      - type: state-label
        entity: sensor.garden_1_title
        tap_action:
          action: more-info
          entity: input_text.garden_1_name
        style:
          left: 70.0%
          top: 16.2%
          font-size: 15px
          font-weight: '500'
          color: var(--secondary-text-color)
          white-space: nowrap
      - type: state-label
        entity: sensor.garden_1_moisture
        style:
          left: 70.7%
          top: 45.0%
          font-size: 34px
          font-weight: '600'
          color: var(--primary-text-color)
      - type: state-label
        entity: sensor.garden_1_status
        attribute: label
        style:
          left: 70.7%
          top: 64.4%
          font-size: 13px
          color: var(--secondary-text-color)
          white-space: nowrap
      - type: state-label
        entity: sensor.garden_1_soil_temperature
        style:
          left: 56.7%
          top: 87.5%
          font-size: 13px
          color: var(--secondary-text-color)
      - type: state-label
        entity: sensor.garden_1_conductivity
        style:
          left: 83.3%
          top: 87.5%
          font-size: 13px
          color: var(--secondary-text-color)
      - type: conditional
        conditions:
        - entity: sensor.garden_1_status
          state: Dry
        elements:
        - type: icon
          icon: mdi:water-off-outline
          tap_action:
            action: none
          style:
            left: 48.7%
            top: 45.0%
            color: '#e0a03a'
            --mdc-icon-size: 28px
      - type: conditional
        conditions:
        - entity: sensor.garden_1_status
          state: Good
        elements:
        - type: icon
          icon: mdi:water-check
          tap_action:
            action: none
          style:
            left: 48.7%
            top: 45.0%
            color: '#4caf50'
            --mdc-icon-size: 28px
      - type: conditional
        conditions:
        - entity: sensor.garden_1_status
          state: Wet
        elements:
        - type: icon
          icon: mdi:water-alert
          tap_action:
            action: none
          style:
            left: 48.7%
            top: 45.0%
            color: '#3b82f6'
            --mdc-icon-size: 28px
      - type: state-icon
        entity: input_boolean.garden_1_outdoors
        tap_action:
          action: toggle
        style:
          left: 6.7%
          top: 87.5%
          color: var(--secondary-text-color)
          --mdc-icon-size: 20px
      - type: conditional
        conditions:
        - entity: binary_sensor.garden_1_battery_low
          state: 'on'
        elements:
        - type: icon
          icon: mdi:battery-alert-variant-outline
          title: Probe battery low
          style:
            left: 94.7%
            top: 13.8%
            color: '#e0533d'
            --mdc-icon-size: 22px
    - type: custom:mini-graph-card
      entities:
      - entity: sensor.garden_1_target_position
        name: Moisture vs. target · 3 days
      hours_to_show: 72
      points_per_hour: 1
      hour24: false
      height: 70
      line_width: 3
      smoothing: true
      animate: false
      lower_bound: 0
      upper_bound: 100
      font_size_header: 13
      show:
        icon: false
        state: false
        legend: false
        labels: false
        points: false
        fill: fade
        name: true
      color_thresholds:
      - value: 0
        color: '#ffb347'
      - value: 33.3
        color: '#6fdc8c'
      - value: 66.7
        color: '#6aa9ff'
      color_thresholds_transition: smooth
