# Devices: chores, pets, power, and anything that needs attention.
title: Devices
path: devices
type: sections
max_columns: 3
dense_section_placement: true

sections:
  - type: grid
    cards:
      - type: heading
        heading: Needs attention
        icon: mdi:alert-circle-outline
      - type: tile
        entity: sensor.household_alerts
        name: Status
        grid_options:
          columns: full
      # Alerts tapped away on Home stay hidden until they clear and come
      # back; this brings them all back now.
      - type: tile
        entity: sensor.household_alerts
        name: Hidden alerts (tap to show again)
        icon: mdi:bell-off-outline
        state_content: hidden
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: input_text.alerts_hidden
            state_not:
              - ""
              - unknown
              - unavailable
        tap_action:
          action: perform-action
          perform_action: script.alerts_unhide_all
          confirmation:
            text: Show all hidden alerts again?
      - type: custom:auto-entities
        grid_options:
          columns: full
        card:
          type: entities
          title: Low batteries
        filter:
          template: "{{ state_attr('sensor.low_batteries', 'entities') or [] }}"
        sort:
          method: state
          numeric: true
        show_empty: false
      - type: custom:auto-entities
        grid_options:
          columns: full
        card:
          type: entities
          title: Offline
          show_header_toggle: false
        # simple-entity rows show the state instead of a useless toggle.
        filter:
          include:
            - domain: light
              state: unavailable
              options: &plain_row
                type: simple-entity
            - domain: media_player
              state: unavailable
              options: *plain_row
            - domain: climate
              state: unavailable
              options: *plain_row
            - domain: vacuum
              state: unavailable
              options: *plain_row
            - domain: fan
              state: unavailable
              options: *plain_row
          exclude:
            # Groups go offline with their bulbs; list the bulbs only.
            - entity_id: light.hallway_lights
            - entity_id: light.garage_lights
            - entity_id: light.ben_s_office_lamp
            # Old or duplicate devices.
            - entity_id: media_player.old_bedroom_tv
            - entity_id: media_player.googletv9555
            - entity_id: media_player.bedroom_tv
            - entity_id: media_player.bedroom_tv_2_2
        sort:
          method: name
        show_empty: false

  - type: grid
    cards:
      - type: heading
        heading: Vacuum
        icon: mdi:robot-vacuum
      - type: tile
        entity: vacuum.acearchr_gmail_com
        name: Vacuum
        grid_options:
          columns: full
        features:
          - type: vacuum-commands
            commands:
              - start_pause
              - stop
              - return_home
              - locate
      - type: tile
        entity: sensor.acearchr_gmail_com_battery
        name: Battery
      - type: tile
        entity: sensor.acearchr_gmail_com_station_state
        name: Dock
        icon: mdi:home-import-outline
      # Parts and supplies that are nearly used up.
      - type: custom:auto-entities
        grid_options:
          columns: full
        card:
          type: entities
          title: Replace soon
        # Template so the long "DEEBOT X11 OmniCyclone" prefix can be dropped.
        filter:
          template: >-
            {%- for s in states.sensor
                 if s.entity_id is match('sensor.acearchr_gmail_com_.*_lifespan')
                 and s.state | is_number and s.state | float < 10 %}
              {{ {'entity': s.entity_id,
                  'name': s.name | replace('DEEBOT X11 OmniCyclone ', '')} }},
            {%- endfor %}
        sort:
          method: state
          numeric: true
        show_empty: false

  - type: grid
    cards:
      - type: heading
        heading: Cats
        icon: mdi:cat
      - type: tile
        entity: sensor.turd_gobbler_9001_status_code
        name: Litter box
        icon: mdi:cat
        grid_options:
          columns: full
      - type: tile
        entity: sensor.turd_gobbler_9001_waste_drawer
        name: Waste drawer
        features: &gauge
          - type: bar-gauge
      - type: tile
        entity: sensor.turd_gobbler_9001_litter_level
        name: Litter level
        features: *gauge
      - type: tile
        entity: sensor.smudge_visits_today
        name: Smudge visits
        icon: mdi:paw
      - type: tile
        entity: sensor.smudge_weight
        name: Smudge weight
        icon: mdi:scale
      - type: tile
        entity: sensor.yue_visits_today
        name: Yue visits
        icon: mdi:paw
      - type: tile
        entity: sensor.yue_weight
        name: Yue weight
        icon: mdi:scale

      # Water fountain (Bedroom): Petlibro Dockstream 2 Cordless.
      - type: heading
        heading: Water fountain
        heading_style: subtitle
        icon: mdi:fountain
      - type: tile
        entity: sensor.dockstream_2_smart_cordless_fountain_remaining_water_2
        name: Water level
        icon: mdi:water
        features: *gauge
        grid_options:
          columns: full
      - type: tile
        entity: sensor.dockstream_2_smart_cordless_fountain_remaining_filter_day
        name: Filter
        icon: mdi:air-filter
      - type: tile
        entity: sensor.dockstream_2_smart_cordless_fountain_remaining_cleaning_days
        name: Cleaning due
        icon: mdi:spray-bottle

  # Laundry (packages/laundry.yaml). Hidden until a washer or dryer plug
  # is reporting power, so it doesn't show empty tiles before they're set up.
  - type: grid
    visibility:
      - condition: or
        conditions:
          - condition: numeric_state
            entity: sensor.washer_power
            above: -1
          - condition: numeric_state
            entity: sensor.dryer_power
            above: -1
    cards:
      - type: heading
        heading: Laundry
        icon: mdi:washing-machine
      - type: tile
        entity: input_select.washer_state
        name: Washer
        icon: mdi:washing-machine
        state_content: [state, last_changed]
      - type: tile
        entity: sensor.washer_power
        name: Washer power
        icon: mdi:flash
      - type: tile
        entity: input_select.dryer_state
        name: Dryer
        icon: mdi:tumble-dryer
        state_content: [state, last_changed]
      - type: tile
        entity: sensor.dryer_power
        name: Dryer power
        icon: mdi:flash
      # Only while a load is waiting; tap once the machine is emptied.
      - type: tile
        entity: script.laundry_emptied
        name: Washer emptied
        icon: mdi:basket-check-outline
        color: green
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: script.laundry_emptied
          data:
            appliance: washer
        visibility:
          - condition: state
            entity: input_select.washer_state
            state: Done
      - type: tile
        entity: script.laundry_emptied
        name: Dryer emptied
        icon: mdi:basket-check-outline
        color: green
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: script.laundry_emptied
          data:
            appliance: dryer
        visibility:
          - condition: state
            entity: input_select.dryer_state
            state: Done

  # Drip watering (packages/drip.yaml, from tools/garden.py). Hidden until
  # the pump's plug is reporting.
  - type: grid
    visibility:
      - condition: or
        conditions:
          - condition: state
            entity: switch.drip_pump_switch
            state: "on"
          - condition: state
            entity: switch.drip_pump_switch
            state: "off"
    cards:
      - type: heading
        heading: Drip watering
        icon: mdi:water-pump
      # What it's doing and why, e.g. "Bed 2 is dry (25%), waters at 5 AM".
      - type: tile
        entity: sensor.drip_1_plan
        name: Garden drip
        state_content: [state, reason]
        grid_options: { columns: full }
      - type: tile
        entity: input_boolean.drip_1_auto
        name: Auto watering
        icon: mdi:water-pump
      - type: tile
        entity: script.drip_1_water_now
        name: Water now
        icon: mdi:watering-can-outline
        color: blue
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: script.drip_1_water_now
      - type: tile
        entity: sensor.drip_1_runtime_today
        name: Pumped today
        icon: mdi:timer-outline
      - type: tile
        entity: sensor.drip_pump_power
        name: Pump power
        icon: mdi:flash
      # The feed-line valves: what each bed rose after the last run, and
      # which valve to turn when the beds drift apart.
      - type: tile
        entity: sensor.drip_1_plan
        name: Valves
        icon: mdi:valve
        state_content: valve_hint
        grid_options: { columns: full }
      - type: tile
        entity: input_text.drip_1_last_rises
        name: Last run, per bed
        icon: mdi:chart-bar
        grid_options: { columns: full }
      # Learned from each run; you can set it by hand too.
      - type: tile
        entity: input_number.drip_1_minutes_per_percent
        name: Minutes per 1% moisture
        icon: mdi:timer-cog-outline
        grid_options: { columns: full }

  - type: grid
    cards:
      - type: heading
        heading: Backup power
        icon: mdi:battery-charging
      - type: tile
        entity: sensor.ecoflow_river_plus_3_battery_charge
        name: Office UPS
        features:
          - type: bar-gauge
      - type: tile
        entity: sensor.ecoflow_river_plus_3_status
        name: UPS status
        icon: mdi:power-plug-outline
      - type: tile
        entity: sensor.shed_battery
        name: Shed battery
        features:
          - type: bar-gauge

  - type: grid
    cards:
      - type: heading
        heading: Lists
        icon: mdi:format-list-checks
      - type: todo-list
        entity: todo.shopping_list
        grid_options:
          columns: full

  - type: grid
    cards:
      - type: heading
        heading: Tablet
        icon: mdi:tablet
      - type: tile
        entity: input_select.wall_tablet_theme_mode
        name: Theme
        grid_options:
          columns: full
        features:
          - type: select-options
            style: buttons
      # Keeps Fully Kiosk in front and reboots a stuck tablet
      # (packages/wall_tablet.yaml). Off while working on a tablet; it turns
      # itself back on after an hour.
      - type: tile
        entity: input_boolean.tablet_watchdog
        name: Watchdog (off while working on a tablet)
        grid_options:
          columns: full
        features:
          - type: toggle
