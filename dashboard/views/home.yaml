# Home: the at-a-glance screen. Keep this to what someone walking past
# needs; everything else belongs on another tab.
title: Home
path: home
type: sections
max_columns: 3
dense_section_placement: true

header:
  layout: responsive
  badges_position: bottom
  card:
    type: markdown
    text_only: true
    content: >-
      {%- set h = now().hour %}
      # Good {{ 'morning' if h < 12 else 'afternoon' if h < 18 else 'evening' }}

badges:
  - type: entity
    entity: person.bhawks
    name: Ben
    show_name: true
    show_entity_picture: true
  - type: entity
    entity: person.megan
    name: Megan
    show_name: true
    show_entity_picture: true
  # The backyard weather station's reading, not the forecast's.
  - type: entity
    entity: sensor.station_temperature
    name: Outside
    show_name: true
  - type: entity
    entity: sensor.hallway_temperature
    name: Inside
    show_name: true
  - type: entity
    entity: sensor.lights_on
    name: Lights on
    show_name: true
    color: amber
    tap_action:
      action: navigate
      navigation_path: /wall-tablet/rooms
    visibility:
      - condition: numeric_state
        entity: sensor.lights_on
        above: 0

sections:
  # Only shown when something needs doing (see sensor.household_alerts).
  - type: grid
    column_span: 3
    visibility:
      - condition: state
        entity: sensor.household_alerts
        state_not:
          - All good
          - unavailable
          - unknown
    cards:
      - type: tile
        entity: sensor.household_alerts
        name: Needs attention
        icon: mdi:alert-circle
        color: red
        grid_options:
          columns: full
        tap_action:
          action: navigate
          navigation_path: /wall-tablet/devices

  # The house at a glance: rooms light up with their lights; tap a room for
  # its devices. Two-thirds of the width, with the clock, forecast and
  # chicken comfort beside it. Same settings as the Floor Plan tab, sized to
  # sit above the fold.
  - type: grid
    column_span: 2
    cards:
      - type: custom:neonplan3d-card
        height: 460
        quality: auto
        theme: neon
        markers: important
        room_panel: true
        alerts: true
        idle_return: 60
        night: sun
        grid_options:
          columns: full

  - type: grid
    cards:
      - type: clock
        clock_size: large
        time_format: "12"
        grid_options:
          columns: full
      - type: weather-forecast
        entity: weather.forecast_home
        show_current: true
        show_forecast: true
        forecast_type: daily
        grid_options:
          columns: full
      # How the hens are feeling (same card as the Chicken Command Center;
      # generated by tools/coop.py).
      - !include chicken_comfort_card.yaml

  - type: grid
    cards:
      - type: heading
        heading: Lights
        heading_style: title
        icon: mdi:lightbulb-group
      # Tap toggles, hold opens brightness/colour.
      - type: tile
        entity: light.basement_lights
        name: Basement
        tap_action: &toggle
          action: toggle
        hold_action: &more_info
          action: more-info
      - type: tile
        entity: light.hallway_lights
        name: Hallway
        tap_action: *toggle
        hold_action: *more_info
      - type: tile
        entity: light.garage_lights
        name: Garage
        tap_action: *toggle
        hold_action: *more_info
      - type: tile
        entity: light.ben_s_office_lamp
        name: Ben's Lamp
        tap_action: *toggle
        hold_action: *more_info
      - type: tile
        entity: script.wall_tablet_all_lights_off
        name: All lights off
        icon: mdi:lightbulb-group-off
        color: amber
        hide_state: true
        grid_options:
          columns: full
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.wall_tablet_all_lights_off

  - type: grid
    cards:
      - type: heading
        heading: Comfort
        heading_style: title
        icon: mdi:home-thermometer
      - type: tile
        entity: climate.hallway
        name: Thermostat
        grid_options:
          columns: full
        features:
          - type: target-temperature
          - type: climate-hvac-modes
            hvac_modes:
              - heat
              - cool
              - heat_cool
              - "off"

      # Now playing on each TV, while it's in use: artwork, title and
      # controls from the richest source available, in this order:
      #   1. the TV's Jellyfin player (official app or Wholphin), found by
      #      the TV's name (Jellyfin names it after the device) or by area
      #   2. its Google Cast entity (YouTube, anything cast from a phone)
      #   3. what its apps report to Android (Netflix, Sling, SmartTube,
      #      Dropout, ...; sensor.tv_<key>_session from packages/tv.yaml):
      #      title, subtitle and app, over the TV's ADB controls
      #   4. the TV's ADB player, when it says something is playing or
      #      paused: at least the app's name (works even before
      #      packages/tv.yaml is loaded).
      # A TV that's just on (home screen, settings, screensaver) gets no card.
      - type: custom:auto-entities
        show_empty: false
        grid_options:
          columns: full
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: >-
            {%- set tvs = [
              {'name': 'Main Room TV', 'area': 'Living Room', 'key': 'main_room_tv',
               'cast': 'media_player.main_room_tv',
               'adb': 'media_player.living_room_main_room_tv_adb'},
              {'name': 'Game Room TV', 'area': 'Game Room', 'key': 'game_room_tv',
               'cast': 'media_player.bedroom_tv_2',
               'adb': 'media_player.game_room_game_room_tv_adb'},
              {'name': 'Bedroom TV', 'area': 'Bedroom', 'key': 'bedroom_tv',
               'cast': 'media_player.bedroom_tv_2_2',
               'adb': 'media_player.bedroom_bedroom_tv_adb'},
            ] %}
            {%- set active = ['playing', 'paused', 'buffering'] %}
            {%- set ns = namespace(cards=[]) %}
            {%- for tv in tvs %}
              {%- set ns2 = namespace(jellyfin=[]) %}
              {%- for e in integration_entities('jellyfin') | select('match', 'media_player\\.') %}
                {%- if states(e) in active and (e in area_entities(tv.area)
                       or (state_attr(e, 'friendly_name') or '') | lower == tv.name | lower) %}
                  {%- set ns2.jellyfin = ns2.jellyfin + [e] %}
                {%- endif %}
              {%- endfor %}
              {%- set jellyfin = ns2.jellyfin %}
              {%- set pick = none %}
              {%- if jellyfin %}
                {%- set pick = jellyfin[0] %}
              {%- elif states(tv.cast) in active %}
                {%- set pick = tv.cast %}
              {%- elif is_state('binary_sensor.tv_' ~ tv.key ~ '_app_playing', 'on') %}
                {%- set pick = tv.adb %}
              {%- endif %}
              {%- set open_app = 'sensor.tv_' ~ tv.key ~ '_app' %}
              {%- set session = 'sensor.tv_' ~ tv.key ~ '_session' %}
              {%- set titled = states(session) in ['playing', 'paused']
                               and state_attr(session, 'title') %}
              {%- if not jellyfin and pick != tv.cast and (titled or pick == tv.adb) %}
                {#- The app's colours as the background (apps don't hand out
                    artwork this way), its logo faint in the corner, the title
                    and buttons in white. Buttons send commands to the TV over
                    ADB, so they don't flicker with its state. Apps that don't
                    say what's playing (e.g. 2nd Try) get the same card with
                    just the app's name. #}
                {%- set brands = {
                  'SmartTube': ['#c4302b', '#2a0708', 'mdi:youtube'],
                  'YouTube': ['#c4302b', '#2a0708', 'mdi:youtube'],
                  'Netflix': ['#b20710', '#141414', 'mdi:netflix'],
                  'Sling TV': ['#1a6be0', '#0b1730', 'mdi:television-classic'],
                  'Jellyfin': ['#8e44b8', '#00405a', 'mdi:jellyfish'],
                  'Wholphin': ['#8e44b8', '#00405a', 'mdi:jellyfish'],
                  'Dropout': ['#c9a400', '#1c1700', 'mdi:drama-masks'],
                  '2nd Try': ['#14c39a', '#0a2a4a', 'mdi:google-downasaur'],
                  'Spotify': ['#1db954', '#08260f', 'mdi:spotify'],
                } %}
                {%- set app = (state_attr(session, 'app') if titled
                               else states(open_app)) or '' %}
                {%- set b = brands.get(app, ['#3d5280', '#121829', 'mdi:television-play']) %}
                {%- set svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 150'>"
                      ~ "<defs><linearGradient id='g' x1='0' y1='1' x2='1' y2='0'>"
                      ~ "<stop offset='0.35' stop-color='" ~ b[1] ~ "'/>"
                      ~ "<stop offset='1' stop-color='" ~ b[0] ~ "'/>"
                      ~ "</linearGradient></defs><rect width='400' height='150' fill='url(#g)'/>"
                      ~ ("" if titled else "<text x='20' y='73' fill='white' fill-opacity='0.75'"
                         ~ " font-family='Roboto, sans-serif' font-size='12'>on "
                         ~ tv.name ~ "</text>")
                      ~ "</svg>" %}
                {%- set white = {'color': 'white', 'white-space': 'nowrap', 'overflow': 'hidden',
                                 'text-overflow': 'ellipsis', 'max-width': '78%',
                                 'transform': 'translate(0, -50%)'} %}
                {%- set ns3 = namespace(buttons=[]) %}
                {%- for icon, action, x in [
                      ['mdi:skip-previous', 'media_previous_track', 10],
                      ['mdi:play-pause', 'media_play_pause', 24],
                      ['mdi:skip-next', 'media_next_track', 38],
                      ['mdi:volume-minus', 'volume_down', 70],
                      ['mdi:volume-plus', 'volume_up', 92]] %}
                  {%- set ns3.buttons = ns3.buttons + [{'type': 'icon', 'icon': icon,
                        'tap_action': {'action': 'perform-action',
                                       'perform_action': 'media_player.' ~ action,
                                       'target': {'entity_id': tv.adb}},
                        'style': {'left': x ~ '%', 'top': '82%', 'color': 'white',
                                  '--mdc-icon-size': '30px'}}] %}
                {%- endfor %}
                {%- set ns.cards = ns.cards + [{'type': 'picture-elements',
                      'image': 'data:image/svg+xml;utf8,' ~ svg | urlencode,
                      'elements': [
                        {'type': 'icon', 'icon': b[2], 'tap_action': {'action': 'none'},
                         'style': {'left': '88%', 'top': '28%', 'color': 'white',
                                   'opacity': '0.3', '--mdc-icon-size': '56px'}},
                      ] + ([
                        {'type': 'state-label', 'entity': session, 'attribute': 'title',
                         'style': dict(white, left='5%', top='20%', **{'font-size': '17px',
                                                                       'font-weight': '600'})},
                        {'type': 'state-label', 'entity': session, 'attribute': 'subtitle',
                         'style': dict(white, left='5%', top='38%', **{'font-size': '13px',
                                                                       'opacity': '0.85'})},
                        {'type': 'state-label', 'entity': session, 'attribute': 'app',
                         'suffix': ' on ' ~ tv.name,
                         'style': dict(white, left='5%', top='55%', **{'font-size': '11px',
                                                                       'opacity': '0.7'})},
                      ] if titled else [
                        {'type': 'state-label', 'entity': open_app,
                         'style': dict(white, left='5%', top='24%', **{'font-size': '20px',
                                                                       'font-weight': '600'})},
                      ]) + ns3.buttons + [
                        {'type': 'state-label', 'entity': open_app, 'attribute': 'volume',
                         'tap_action': {'action': 'more-info', 'entity': tv.adb},
                         'style': {'left': '81%', 'top': '82%', 'color': 'white',
                                   'font-size': '13px', 'opacity': '0.85'}},
                      ]}] %}
              {%- elif pick %}
                {%- set ns.cards = ns.cards + [{'type': 'media-control', 'entity': pick}] %}
              {%- endif %}
            {%- endfor %}
            {#- Home Assistant turns this into a list with Python's rules before
                auto-entities sees it, so no JSON true/false/null in here, and
                to_json (not tojson) keeps emoji in titles intact. #}
            {{ ns.cards | to_json }}

      # Speakers playing anywhere in the house (the TVs are above). A speaker
      # carrying a TV's sound reports "playing" a title of "TV" whenever the
      # TV is on; that's left out too, as is anything named "…TV…".
      - type: custom:auto-entities
        show_empty: false
        grid_options:
          columns: full
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          exclude:
            - integration: jellyfin
            - integration: androidtv_remote
            - integration: androidtv
            - integration: universal
            - attributes:
                media_title: TV
            - name: "*TV*"
            - entity_id: media_player.main_room_tv
            - entity_id: media_player.bedroom_tv_2
            - entity_id: media_player.bedroom_tv_2_2
          include:
            - domain: media_player
              state: playing
              options:
                type: tile
                features:
                  - type: media-player-playback
                  - type: media-player-volume-slider
            - domain: media_player
              state: paused
              options:
                type: tile
                features:
                  - type: media-player-playback

      - type: heading
        heading: Around the house
        heading_style: subtitle
      - type: tile
        entity: vacuum.acearchr_gmail_com
        name: Vacuum
        features:
          - type: vacuum-commands
            commands:
              - start_pause
              - return_home
      # Laundry (packages/laundry.yaml): only while a machine is running or
      # has a finished load in it. "Done" tiles: tap once it's emptied.
      - type: tile
        entity: input_select.washer_state
        name: Washer
        icon: mdi:washing-machine
        color: blue
        state_content: [state, last_changed]
        tap_action: &laundry_info
          action: navigate
          navigation_path: /wall-tablet/devices
        visibility:
          - condition: state
            entity: input_select.washer_state
            state: Running
      - type: tile
        entity: input_select.washer_state
        name: Washer done · tap when emptied
        icon: mdi:washing-machine-alert
        color: green
        state_content: last_changed
        tap_action:
          action: perform-action
          perform_action: script.laundry_emptied
          data:
            appliance: washer
        visibility:
          - condition: state
            entity: input_select.washer_state
            state: Done
      - type: tile
        entity: input_select.dryer_state
        name: Dryer
        icon: mdi:tumble-dryer
        color: deep-orange
        state_content: [state, last_changed]
        tap_action: *laundry_info
        visibility:
          - condition: state
            entity: input_select.dryer_state
            state: Running
      - type: tile
        entity: input_select.dryer_state
        name: Dryer done · tap when emptied
        icon: mdi:tumble-dryer-alert
        color: green
        state_content: last_changed
        tap_action:
          action: perform-action
          perform_action: script.laundry_emptied
          data:
            appliance: dryer
        visibility:
          - condition: state
            entity: input_select.dryer_state
            state: Done
      - type: tile
        entity: sensor.turd_gobbler_9001_waste_drawer
        name: Litter drawer
        icon: mdi:cat
        tap_action:
          action: navigate
          navigation_path: /wall-tablet/devices
