# Chicken Command Center: a single-screen dashboard for the coop tablet
# (low-power Android tablet, 1280×800, landscape). Left two-thirds: Coop Cam
# 1 and 2 side by side over a wide Chicken Run feed. Right third: the animated
# coop scene, chicken comfort, controls and coop graphs (generated by
# tools/coop.py into coop_side_section.yaml).
#
# Tuned for a slow tablet:
# - Feeds use UniFi Protect's low resolution channel (about 640×360), which
#   matches a quarter of the screen. Decoding three full-resolution streams
#   is what would make the tablet struggle. Enable "Low resolution channel"
#   on each camera in UniFi Protect (it's off by default).
# - Only one feed plays live video at a time: Chicken Run by day, Coop Cam 2
#   by night (sun below the horizon). The others are stills that refresh
#   every 10 seconds ("auto"), which cost almost nothing. Tap any feed to
#   open it live, full screen. Each switching feed exists twice, a live and
#   a still version, and a conditional card shows the right one.
#
# Camera entity IDs: Home Assistant prefixes new entities with their area,
# hence camera.chicken_coop_…; the older motion sensors keep their names. If
# a feed is blank, check Settings → Entities (search "low resolution").

# One screen, no tabs: hide the header too for the (non-admin) tablet user.
kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true

title: Chicken Command Center
views:
  - title: Coop
    path: coop
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: grid
            columns: 2
            square: false
            grid_options:
              columns: full
            cards:
              # Tap a feed to open it live, full screen.
              # Coop Cam 1: always a still.
              - type: picture-glance
                title: Coop Cam 1
                camera_image: camera.chicken_coop_chicken_cam_1_low_resolution_channel
                camera_view: auto
                aspect_ratio: "16:9"
                entities:
                  - binary_sensor.chicken_cam_1_motion

              # Coop Cam 2: live at night, a still by day.
              - type: conditional
                conditions:
                  - condition: state
                    entity: sun.sun
                    state: below_horizon
                card: &cam_2
                  type: picture-glance
                  title: Coop Cam 2
                  camera_image: camera.chicken_coop_chicken_cam_2_low_resolution_channel
                  camera_view: live
                  aspect_ratio: "16:9"
                  entities:
                    - binary_sensor.chicken_cam_2_motion
              - type: conditional
                conditions:
                  - condition: state
                    entity: sun.sun
                    state_not: below_horizon
                card:
                  <<: *cam_2
                  camera_view: auto

          # Chicken Run, full width: live by day, a still at night.
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: sun.sun
                state_not: below_horizon
            card: &chicken_run
              type: picture-glance
              title: Chicken Run
              camera_image: camera.chicken_coop_chicken_run_low_resolution_channel
              camera_view: live
              aspect_ratio: "16:9"
              entities:
                - binary_sensor.chicken_run_motion
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: sun.sun
                state: below_horizon
            card:
              <<: *chicken_run
              camera_view: auto

      # Scene, comfort, controls and graphs: generated by tools/coop.py.
      - !include coop_side_section.yaml
