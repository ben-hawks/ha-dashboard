  - name: Drip Problems
    unique_id: drip_problems
    icon: mdi:water-pump-off
    state: '{{ [1] | map(''string'') | map(''regex_replace'', ''^'', ''sensor.drip_'') | map(''regex_replace'', ''$'', ''_plan'') | select(''is_state'', ''Problem'') | list | count }}'
    attributes:
      items: '{%- set ns = namespace(a=[]) %}{%- for z in [1] %}{%- if is_state(''sensor.drip_'' ~ z ~ ''_plan'', ''Problem'') and is_state(''input_boolean.drip_'' ~ z ~ ''_auto'', ''on'') %}{%- set ns.a = ns.a + [{''zone'': z, ''text'': state_attr(''sensor.drip_'' ~ z ~ ''_plan'', ''zone_name'') ~ '' needs a look''}] %}{%- endif %}{%- endfor %}{{ ns.a }}'
script:
  drip_1_pulse:
    alias: 'Garden drip: one watering run'
    icon: mdi:water-pump
    mode: restart
    fields:
      minutes:
        description: How long to run the pump
        example: 4
      bed:
        description: The bed whose probe judges the run
        example: 1
      flush:
        description: This is the day's salt flush
        example: false
    sequence:
    - variables:
        mins: '{{ [[minutes | float(1), 0.2] | max, 14] | min }}'
        probe: sensor.garden_{{ bed | int(1) }}
        flushing: '{{ flush | default(false) | bool(false) }}'
    - variables:
        m0: '{{ states(probe ~ ''_moisture'') | float(0) }}'
        r0: '{{ states(''sensor.station_rain_today'') | float(0) }}'
        before: '{{ [1, 2, 3, 4] | map(''string'') | map(''regex_replace'', ''^'', ''sensor.garden_'') | map(''regex_replace'', ''$'', ''_moisture'') | map(''states'') | map(''float'', 0) | list }}'
    - action: switch.turn_on
      target:
        entity_id: switch.drip_pump_switch
    - delay:
        seconds: '{{ (mins * 60) | int }}'
    - action: switch.turn_off
      target:
        entity_id: switch.drip_pump_switch
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.drip_1_last_run
      data:
        timestamp: '{{ now().timestamp() }}'
    - if:
      - condition: template
        value_template: '{{ flushing }}'
      then:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.drip_1_last_flush
        data:
          date: '{{ now().date() }}'
    - delay:
        minutes: 45
    - variables:
        rise: '{{ states(probe ~ ''_moisture'') | float(0) - m0 }}'
        rained: '{{ states(''sensor.station_rain_today'') | float(0) > r0 }}'
        wet: '{{ state_attr(probe ~ ''_status'', ''wet_above'') | float(70) }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.drip_1_last_rises
      data:
        value: '{%- set ns = namespace(out=[]) %}{%- for c in [1, 2, 3, 4] %}{%- set m = states(''sensor.garden_'' ~ c ~ ''_moisture'') | float(0) %}{%- if m > 0 and before[loop.index0] > 0 %}{%- set r = (m - before[loop.index0]) | round(0) | int %}{%- set ns.out = ns.out + [states(''sensor.garden_'' ~ c ~ ''_name'') ~ '' '' ~ (''+'' if r >= 0 else '''') ~ r ~ ''%''] %}{%- endif %}{%- endfor %}{{ (ns.out | join('', '') ~ ('' (rained)'' if rained else ''''))[:255] }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ rise >= 1 or rained }}'
        sequence:
        - action: input_number.set_value
          target:
            entity_id: input_number.drip_1_no_response
          data:
            value: 0
        - if:
          - condition: template
            value_template: '{{ rise >= 1 and not rained and not flushing }}'
          then:
          - action: input_number.set_value
            target:
              entity_id: input_number.drip_1_minutes_per_percent
            data:
              value: '{%- set mpp = states(''input_number.drip_1_minutes_per_percent'') | float(0) %}{%- set mpp = mpp if mpp > 0.05 else 0.5 %}{{ [[mpp * 0.7 + mins / rise * 0.3, 0.060000000000000005] | max, 5] | min | round(2) }}'
      - conditions:
        - condition: template
          value_template: '{{ m0 > 0 and m0 + rise < wet - 5 }}'
        sequence:
        - action: input_number.increment
          target:
            entity_id: input_number.drip_1_no_response
  drip_1_water_now:
    alias: 'Garden drip: water now'
    icon: mdi:watering-can-outline
    mode: single
    sequence:
    - action: script.turn_on
      target:
        entity_id: script.drip_1_pulse
      data:
        variables:
          minutes: '{{ [state_attr(''sensor.drip_1_plan'', ''minutes'') | float(0), 3] | max }}'
          bed: '{{ state_attr(''sensor.drip_1_plan'', ''bed'') | int(1) or 1 }}'
          flush: false
automation:
- id: drip_1_auto_water
  alias: 'Drip - Garden drip: water when the beds need it'
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /5
  - trigger: state
    entity_id: sensor.drip_1_plan
    to: Water
  conditions:
  - condition: state
    entity_id: input_boolean.drip_1_auto
    state: 'on'
  - condition: state
    entity_id: sensor.drip_1_plan
    state: Water
  - condition: state
    entity_id: switch.drip_pump_switch
    state: 'off'
  - condition: state
    entity_id: script.drip_1_pulse
    state: 'off'
  actions:
  - action: script.turn_on
    target:
      entity_id: script.drip_1_pulse
    data:
      variables:
        minutes: '{{ state_attr(''sensor.drip_1_plan'', ''minutes'') }}'
        bed: '{{ state_attr(''sensor.drip_1_plan'', ''bed'') }}'
        flush: '{{ state_attr(''sensor.drip_1_plan'', ''flush'') }}'
- id: drip_1_failsafe
  alias: 'Drip - Garden drip: never run longer than 15 min'
  triggers:
  - trigger: state
    entity_id: switch.drip_pump_switch
    to: 'on'
    for:
      minutes: 15
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.drip_pump_switch
- id: drip_1_auto_on
  alias: 'Drip - Garden drip: Auto on clears problems'
  triggers:
  - trigger: state
    entity_id: input_boolean.drip_1_auto
    to: 'on'
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.drip_1_no_response
    data:
      value: 0
- id: drip_1_no_power
  alias: 'Drip - Garden drip: stop if the pump draws no power'
  triggers:
  - trigger: state
    entity_id: switch.drip_pump_switch
    to: 'on'
    for:
      seconds: 30
  conditions:
  - condition: template
    value_template: '{{ is_number(states(''sensor.drip_pump_power'')) and states(''sensor.drip_pump_power'') | float < 1.0 }}'
  actions:
  - action: script.turn_off
    target:
      entity_id: script.drip_1_pulse
  - action: switch.turn_off
    target:
      entity_id: switch.drip_pump_switch
  - action: input_number.set_value
    target:
      entity_id: input_number.drip_1_no_response
    data:
      value: 3
- id: drip_pumps_off_on_start
  alias: Drip - pumps off when Home Assistant starts
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - action: switch.turn_off
    target:
      entity_id:
      - switch.drip_pump_switch
    continue_on_error: true
