# GENERATED by tools/garden.py: edit DRIP_ZONES / DRIP there and re-run
# it, don't edit this file by hand.
input_boolean:
  drip_1_auto:
    name: Garden drip auto watering
    icon: mdi:water-pump
input_number:
  drip_1_minutes_per_percent:
    name: Garden drip minutes per percent
    icon: mdi:timer-cog-outline
    min: 0.05
    max: 5
    step: 0.01
    mode: box
    unit_of_measurement: min/%
  drip_1_no_response:
    name: Garden drip runs without a rise
    icon: mdi:water-alert-outline
    min: 0
    max: 10
    step: 1
    mode: box
input_datetime:
  drip_1_last_run:
    name: Garden drip last run
    has_date: true
    has_time: true
    icon: mdi:history
  drip_1_last_flush:
    name: Garden drip last flush
    has_date: true
    has_time: false
    icon: mdi:shaker-outline
input_text:
  drip_1_last_rises:
    name: Garden drip last run rise per bed
    icon: mdi:valve
    max: 255
sensor:
- platform: history_stats
  name: Drip 1 Runtime Today
  unique_id: drip_1_runtime_today
  entity_id: switch.drip_pump_switch
  state: 'on'
  type: time
  start: '{{ today_at() }}'
  end: '{{ now() }}'
template:
- sensor:
  - name: Drip 1 Plan
    unique_id: drip_1_plan
    icon: mdi:water-pump
    state: '{%- set ec_max = {''Seedling'': 1000, ''Lettuce'': 1300, ''Tomato'': 2500, ''Pepper'': 1500, ''Carrot'': 1000, ''Herbs'': 1500, ''Cucumber'': 2500, ''Strawberry'': 1000, ''Blueberry'': 1000, ''Raspberry'': 1000, ''Sunflower'': 2500, ''Flowers'': 1500, ''Succulent'': 3000} %}{%- set ns = namespace(valid=0, wet=[], bed=0, name='''', m=0, dry=0, wetl=100, gap=999, salty=false, outdoor=false, cold_soil=false, lo=9, lo_name='''', hi=-9, hi_name='''') %}{%- for c in [1, 2, 3, 4] %}{%- set s = ''sensor.garden_'' ~ c %}{%- set out = is_state(''input_boolean.garden_'' ~ c ~ ''_outdoors'', ''on'') %}{%- if out %}{% set ns.outdoor = true %}{%- if states(s ~ ''_soil_temperature'') | float(60) <= 35 %}{% set ns.cold_soil = true %}{% endif %}{%- endif %}{%- set m = states(s ~ ''_moisture'') | float(0) %}{%- if m > 0 and has_value(s ~ ''_status'') %}{%- set dry = state_attr(s ~ ''_status'', ''dry_below'') | float(30) %}{%- set wet = state_attr(s ~ ''_status'', ''wet_above'') | float(70) %}{%- set ns.valid = ns.valid + 1 %}{%- if m > wet %}{% set ns.wet = ns.wet + [states(s ~ ''_name'')] %}{% endif %}{%- if m - dry < ns.gap %}{% set ns.gap = m - dry %}{% set ns.bed = c %}{%- set ns.name = states(s ~ ''_name'') %}{% set ns.m = m %}{%- set ns.dry = dry %}{% set ns.wetl = wet %}{% endif %}{%- set pos = (m - dry) / ([wet - dry, 1] | max) %}{%- if pos < ns.lo %}{% set ns.lo = pos %}{% set ns.lo_name = states(s ~ ''_name'') %}{% endif %}{%- if pos > ns.hi %}{% set ns.hi = pos %}{% set ns.hi_name = states(s ~ ''_name'') %}{% endif %}{%- if (out or False) and states(s ~ ''_conductivity'') | float(0) > ec_max.get(states(''input_select.garden_'' ~ c ~ ''_plant''), 2000) %}{% set ns.salty = true %}{% endif %}{%- endif %}{%- endfor %}{%- set target = ns.dry + (ns.wetl - ns.dry) * 0.5 %}{%- set cold = ns.outdoor and (ns.cold_soil or states(''sensor.station_temperature'') | float(60) <= 38) %}{%- set raining = ns.outdoor and states(''sensor.station_rain_rate'') | float(0) > 0 %}{%- s