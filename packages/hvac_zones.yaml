- id: hvac_zone_controller
  alias: 'HVAC zoning: controller'
  description: Generated by tools/hvac_zones.py
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: state
    entity_id:
    - input_select.hvac_house_mode
    - climate.hallway
  - trigger: state
    entity_id: input_select.hvac_control
    to:
    - Preview
    - Home Assistant
  conditions:
  - condition: state
    entity_id: input_select.hvac_control
    state:
    - Preview
    - Home Assistant
  actions:
  - variables:
      rooms:
      - id: living_room
        vents: []
        registers: 1
        weight: 1.0
      - id: kitchen
        vents: []
        registers: 1
        weight: 1.0
      - id: dining
        vents: []
        registers: 1
        weight: 1.0
      - id: foyer
        vents: []
        registers: 1
        weight: 1.0
      - id: hallway
        vents: []
        registers: 1
        weight: 1.0
      - id: bath
        vents: []
        registers: 1
        weight: 1.0
      - id: bedroom
        vents: []
        registers: 1
        weight: 1.0
      - id: office
        vents: []
        registers: 1
        weight: 1.0
      - id: megs_office
        vents: []
        registers: 1
        weight: 1.0
      - id: game_room
        vents: []
        registers: 1
        weight: 1.0
      - id: work_office
        vents: []
        registers: 1
        weight: 1.0
      - id: laundry
        vents: []
        registers: 1
        weight: 1.0
      live: '{{ is_state(''input_select.hvac_control'', ''Home Assistant'') }}'
      thermostat: climate.hallway
      nest_mode: '{{ states(''climate.hallway'') }}'
      nest_temp: '{{ state_attr(''climate.hallway'', ''current_temperature'') }}'
      call_now: '{{ states(''input_select.hvac_zone_call'') }}'
      since: '{{ (now() - states.input_select.hvac_zone_call.last_changed).total_seconds() | int }}'
      rise_high: '{{ false }}'
      rows: "{%- set ns = namespace(r=[]) %}\n{%- for z in rooms %}\n  {%- set t = states('sensor.hvac_zone_' ~ z.id ~ '_temperature') | float(none) %}\n  {%- if t is not none and not is_state('input_boolean.hvac_zone_' ~ z.id ~ '_excluded', 'on') %}\n    {%- set h = states('sensor.hvac_zone_' ~ z.id ~ '_heat_target') | float(0) %}\n    {%- set c = states('sensor.hvac_zone_' ~ z.id ~ '_cool_target') | float(0) %}\n    {%- set ns.r = ns.r + [{'id': z.id,\n        'heat_need': ((h - t) * z.weight) | round(2),\n        'cool_need': ((t - c) * z.weight) | round(2),\n        'past_heat': (t - h) | round(2),\n        'past_cool': (c - t) | round(2)}] %}\n  {%- endif %}\n{%- endfor %}\n{{ ns.r }}"
  - variables:
      new_call: "{%- set n = rows | count %}\n{%- set heat_max = (rows | map(attribute='heat_need') | max) if n else -99 %}\n{%- set cool_max = (rows | map(attribute='cool_need') | max) if n else -99 %}\n{%- set warm = (rows | map(attribute='past_heat') | sum / n) if n else 0 %}\n{%- set cold = (rows | map(attribute='past_cool') | sum / n) if n else 0 %}\n{%- set can_heat = nest_mode in ['heat', 'heat_cool'] %}\n{%- set can_cool = nest_mode in ['cool', 'heat_cool'] %}\n{%- if call_now == 'heat' %}\n  {%- if not can_heat or (since >= 300 and (heat_max <= -0.5 or warm >= 2.0)) %}idle{% else %}heat{% endif %}\n{%- elif call_now == 'cool' %}\n  {%- if not can_cool or (since >= 300 and (cool_max <= -0.5 or cold >= 2.0)) %}idle{% else %}cool{% endif %}\n{%- elif since < 300 %}idle\n{%- elif can_heat and heat_max >= 0.5 and (not can_cool or heat_max >= cool_max) %}heat\n{%- elif can_cool and cool_max >= 0.5 %}cool\n{%- else %}idle{% endif %}"
      hold_until: '{% set u = states(''input_datetime.hvac_vent_hold_until'') | as_datetime(none) %}{{ u | as_local if u is not none else none }}'
  - if:
    - condition: template
      value_template: '{{ rise_high }}'
    then:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.hvac_vent_hold_until
      data:
        datetime: '{{ (now() + timedelta(minutes=30)).strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - variables:
      hold: '{{ rise_high or (hold_until is not none and now() < hold_until | as_datetime) }}'
      nest: "{%- set t = nest_temp | float(70) %}\n{%- set lo_min, lo_max, hi_min, hi_max = [50, 85][0], [50, 85][1], [60, 90][0], [60, 90][1] %}\n{%- set floor = states('input_number.hvac_away_heat') | float(60) %}\n{%- set ceiling = states('input_number.hvac_away_cool') | float(82) %}\n{%- set cur = state_attr(thermostat, 'temperature') | float(none) %}\n{%- set cur_lo = state_attr(thermostat, 'target_temp_low') | float(none) %}\n{%- set cur_hi = state_attr(thermostat, 'target_temp_high') | float(none) %}\n{%- set changed = new_call != call_now %}\n{%- if nest_mode == 'heat_cool' %}\n  {%- if new_call == 'heat' %}{% set lo = t + 2 %}{% set hi = lo + 4 %}\n  {%- elif new_call == 'cool' %}{% set hi = t - 2 %}{% set lo = hi - 4 %}\n  {%- else %}{% set lo = [t - 2, floor] | max %}{% set hi = [t + 2, ceiling] | min %}{% endif %}\n  {%- set lo = ([[lo | round(0), lo_min] | max, lo_max] | min) | int %}\n  {%- set hi = ([[hi | round(0), hi_min, lo + 3] | max, hi_max] | min) | int %}\n  {%- set wrong = cur_lo is none or cur_hi is none\n      or (new_call == 'heat' and cur_lo - t < 1)\n      or (new_call == 'cool' and t - cur_hi < 1)\n      or (new_call == 'idle' and (t - cur_lo < 1 or cur_hi - t < 1)) %}\n  {%- set differs = cur_lo is none or cur_hi is none or (cur_lo - lo) | abs >= 1 or (cur_hi - hi) | abs >= 1 %}\n  {{ {'send': differs and (changed or wrong), 'data': {'target_temp_low': lo, 'target_temp_high': hi}} }}\n{%- elif nest_mode in ['heat', 'cool'] %}\n  {%- if nest_mode == 'heat' %}\n    {%- set want = t + 2 if new_call == 'heat' else [t - 2, floor] | max %}\n    {%- set want = ([[want | round(0), lo_min] | max, lo_max] | min) | int %}\n    {%- set wrong = cur is none or (new_call == 'heat' and cur - t < 1) or (new_call != 'heat' and t - cur < 1) %}\n  {%- else %}\n    {%- set want = t - 2 if new_call == 'cool' else [t + 2, ceiling] | min %}\n    {%- set want = ([[want | round(0), hi_min] | max, hi_max] | min) | int %}\n    {%- set wrong = cur is none or (new_call == 'cool' and t - cur < 1) or (new_call != 'cool' and cur - t < 1) %}\n  {%- endif %}\n  {%- set differs = cur is none or (cur - want) | abs >= 1 %}\n  {{ {'send': differs and (changed or wrong), 'data': {'temperature': want}} }}\n{%- else %}\n  {{ {'send': false, 'data': {}} }}\n{%- endif %}"
  - if:
    - condition: template
      value_template: '{{ new_call != call_now }}'
    then:
    - action: input_select.select_option
      target:
        entity_id: input_select.hvac_zone_call
      data:
        option: '{{ new_call }}'
  - variables:
      moves: '{{ [] }}'
  - if:
    - condition: template
      value_template: '{{ new_call != ''idle'' or hold }}'
    then:
    - variables:
        moves: "{%- set minp = states('input_number.hvac_vent_min_position') | int(20) %}\n{%- set frac = states('input_number.hvac_min_open_percent') | float(60) / 100 %}\n{%- set ns = namespace(items=[], total=0, open=0) %}\n{%- for z in rooms %}\n  {%- set ns.total = ns.total + z.registers + z.vents | count %}\n  {%- set ns.open = ns.open + z.registers %}\n  {%- if z.vents | count > 0 %}\n    {%- set row = rows | selectattr('id', 'eq', z.id) | list | first | default(none) %}\n    {%- if hold %}{% set need = 99 %}\n    {%- elif is_state('input_boolean.hvac_zone_' ~ z.id ~ '_excluded', 'on') %}{% set need = -99 %}\n    {%- elif row is none %}{% set need = 99 %}\n    {%- elif new_call == 'heat' %}{% set need = row.heat_need %}\n    {%- else %}{% set need = row.cool_need %}{% endif %}\n    {%- set pos = 100 if need >= 0 else (50 if need > -1 else minp) %}\n    {%- set ns.items = ns.items + [{'vents': z.vents, 'need': need, 'pos': pos}] %}\n    {%- set ns.open = ns.open + (z.vents | count) * pos / 100 %}\n  {%- endif %}\n{%- endfor %}\n{%- set out = namespace(list=[], open=ns.open) %}\n{%- for it in ns.items | sort(attribute='need', reverse=true) %}\n  {%- set p = it.pos %}\n  {%- if ns.total > 0 and out.open / ns.total < frac and p < 100 %}\n    {%- set out.open = out.open + (it.vents | count) * (100 - p) / 100 %}\n    {%- set p = 100 %}\n  {%- endif %}\n  {%- for v in it.vents %}\n    {%- set cur = state_attr(v, 'current_position') | int(-1) %}\n    {%- if cur < 0 or (cur - p) | abs >= 20 %}\n      {%- set out.list = out.list + [{'entity': v, 'position': p}] %}\n    {%- endif %}\n  {%- endfor %}\n{%- endfor %}\n{{ out.list }}"
  - if:
    - condition: template
      value_template: '{{ live }}'
    then:
    - if:
      - condition: template
        value_template: '{{ nest.send }}'
      then:
      - action: climate.set_temperature
        target:
          entity_id: climate.hallway
        data: '{{ nest.data }}'
    - repeat:
        for_each: '{{ moves }}'
        sequence:
        - action: cover.set_cover_position
          continue_on_error: true
          target:
            entity_id: '{{ repeat.item.entity }}'
          data:
            position: '{{ repeat.item.position }}'
    else:
    - if:
      - condition: template
        value_template: '{{ new_call != call_now or nest.send or moves | count > 0 }}'
      then:
      - action: logbook.log
        data:
          name: HVAC zoning preview
          entity_id: input_select.hvac_zone_call
          message: '{{ ''would call '' ~ new_call ~ ('' (was '' ~ call_now ~ '')'' if new_call != call_now else '''') ~ (''; Nest '' ~ nest.data if nest.send else '''') ~ (''; vents'' if moves | count > 0 else '''') }}{% for m in moves %} {{ m.entity }} → {{ m.position }}%{% endfor %}'
- id: hvac_zoning_off
  alias: 'HVAC zoning: hand back to the Nest'
  description: Generated by tools/hvac_zones.py. Opens every vent and restores the house mode's hallway targets on the Nest.
  mode: single
  triggers:
  - trigger: state
    entity_id: input_select.hvac_control
    from: Home Assistant
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.hvac_zone_call
    data:
      option: idle
  - choose:
    - conditions:
      - condition: state
        entity_id: climate.hallway
        state: heat_cool
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.hallway
        data:
          target_temp_low: '{{ states(''sensor.hvac_zone_hallway_heat_target'') | float(68) | round(0) }}'
          target_temp_high: '{{ states(''sensor.hvac_zone_hallway_cool_target'') | float(75) | round(0) }}'
    - conditions:
      - condition: state
        entity_id: climate.hallway
        state: heat
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.hallway
        data:
          temperature: '{{ states(''sensor.hvac_zone_hallway_heat_target'') | float(68) | round(0) }}'
    - conditions:
      - condition: state
        entity_id: climate.hallway
        state: cool
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.hallway
        data:
          temperature: '{{ states(''sensor.hvac_zone_hallway_cool_target'') | float(75) | round(0) }}'
- id: hvac_house_mode_auto
  alias: 'HVAC zoning: house mode follows presence and bedtime'
  description: Generated by tools/hvac_zones.py
  mode: queued
  triggers:
  - trigger: time
    at: input_datetime.hvac_sleep_time
    id: sleep
  - trigger: time
    at: input_datetime.hvac_wake_time
    id: wake
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
    for:
      minutes: 15
    id: away
  - trigger: numeric_state
    entity_id: zone.home
    above: 0
    id: arrive
  conditions:
  - condition: state
    entity_id: input_boolean.hvac_auto_mode
    state: 'on'
  actions:
  - variables:
      home: '{{ states(''zone.home'') | int(0) > 0 }}'
      asleep: '{% set s = states(''input_datetime.hvac_sleep_time'') %}{% set w = states(''input_datetime.hvac_wake_time'') %}{% set n = now().strftime(''%H:%M:%S'') %}{{ (n >= s or n < w) if s > w else (s <= n < w) }}'
  - action: input_select.select_option
    target:
      entity_id: input_select.hvac_house_mode
    data:
      option: '{{ ''Away'' if not home else (''Sleep'' if asleep else ''Home'') }}'
