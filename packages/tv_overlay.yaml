# GENERATED by tools/tvoverlay.py: edit its SETTINGS and re-run, don't
# edit this file by hand. Setup: docs/tvoverlay.md
rest_command:
  tvoverlay_notify:
    url: http://{{ host }}:5001/notify
    method: post
    content_type: application/json; charset=utf-8
    payload: '{{ payload | to_json }}'
    timeout: 5
  tvoverlay_fixed:
    url: http://{{ host }}:5001/notify_fixed
    method: post
    content_type: application/json; charset=utf-8
    payload: '{{ payload | to_json }}'
    timeout: 5
script:
  tv_popup:
    alias: 'TVs: pop-up'
    icon: mdi:television-ambient-light
    mode: parallel
    fields:
      title:
        description: Big text
        example: Washer is done
      message:
        description: Smaller text
        example: Time to move it to the dryer
      small_icon:
        description: 'mdi: icon'
        example: mdi:washing-machine
      large_icon:
        description: 'mdi: icon or image URL'
      image:
        description: Picture URL the TVs can reach
      color:
        description: Icon colour
        example: '#3b82f6'
      seconds:
        description: How long it shows
        example: 12
      corner:
        description: bottom_start, bottom_end, top_start or top_end
      id:
        description: Replaces an earlier pop-up with the same id
    sequence:
    - variables:
        payload: '{%- set p = {''title'': title | default(''''), ''message'': message | default(''''), ''source'': ''Home Assistant'', ''appTitle'': ''Home Assistant'', ''smallIcon'': small_icon | default(''mdi:home-assistant''), ''smallIconColor'': color | default(''#049cdb''), ''color'': color | default(''#049cdb''), ''duration'': seconds | default(12) | int, ''seconds'': seconds | default(12) | int} %}{%- if id is defined %}{% set p = dict(p, id=id) %}{% endif %}{%- if image is defined and image %}{% set p = dict(p, image=image) %}{% endif %}{%- if large_icon is defined %}{% set p = dict(p, largeIcon=large_icon) %}{% endif %}{%- if corner is defined %}{% set p = dict(p, corner=corner) %}{% endif %}{{ p }}'
    - repeat:
        for_each: []
        sequence:
        - if:
          - condition: template
            value_template: '{{ states(repeat.item.adb) not in [''off'', ''standby'', ''unavailable'', ''unknown''] }}'
          then:
          - action: rest_command.tvoverlay_notify
            data:
              host: '{{ repeat.item.host }}'
              payload: '{{ payload }}'
            continue_on_error: true
  tv_badges:
    alias: 'TVs: refresh corner badges'
    icon: mdi:television-guide
    mode: queued
    max: 3
    sequence:
    - variables:
        badges:
        - id: weather
          visible: true
          message: '{{ states(''sensor.station_temperature'') | float(0) | round(0) | int }}°'
          text: '{{ states(''sensor.station_temperature'') | float(0) | round(0) | int }}°'
          icon: '{%- set icons = {''Sunny'': ''mdi:weather-sunny'', ''Partly cloudy'': ''mdi:weather-partly-cloudy'', ''Cloudy'': ''mdi:weather-cloudy'', ''Rain'': ''mdi:weather-rainy'', ''Snow'': ''mdi:weather-snowy'', ''Night'': ''mdi:weather-night'', ''Fog'': ''mdi:weather-fog''} %}{{ icons.get(states(''sensor.station_sky''), ''mdi:thermometer'') }}'
          iconColor: '#FFFFFF'
          borderColor: '#FFFFFF'
          messageColor: '#FFFFFF'
          textColor: '#FFFFFF'
          backgroundColor: '#99000000'
          shape: rounded
          expiration: 1h
        - id: alerts
          visible: '{{ states(''sensor.household_alerts'') not in [''All good'', ''unknown'', ''unavailable''] }}'
          message: '{{ states(''sensor.household_alerts'') | truncate(40) }}'
          text: '{{ states(''sensor.household_alerts'') | truncate(40) }}'
          icon: mdi:alert-circle
          iconColor: '#e5484d'
          borderColor: '#e5484d'
          messageColor: '#FFFFFF'
          textColor: '#FFFFFF'
          backgroundColor: '#99000000'
          shape: rounded
        - id: laundry
          visible: '{{ is_state(''input_select.washer_state'', ''Done'') or is_state(''input_select.dryer_state'', ''Done'') }}'
          message: '{%- set w = is_state(''input_select.washer_state'', ''Done'') %}{%- set d = is_state(''input_select.dryer_state'', ''Done'') %}{{ ''Washer & dryer done'' if w and d else ''Washer done'' if w else ''Dryer done'' }}'
          text: '{%- set w = is_state(''input_select.washer_state'', ''Done'') %}{%- set d = is_state(''input_select.dryer_state'', ''Done'') %}{{ ''Washer & dryer done'' if w and d else ''Washer done'' if w else ''Dryer done'' }}'
          icon: '{{ ''mdi:tumble-dryer'' if is_state(''input_select.dryer_state'', ''Done'') and not is_state(''input_select.washer_state'', ''Done'') else ''mdi:washing-machine'' }}'
          iconColor: '#3b82f6'
          borderColor: '#3b82f6'
          messageColor: '#FFFFFF'
          textColor: '#FFFFFF'
          backgroundColor: '#99000000'
          shape: rounded
        - id: coop
          visible: '{{ states(''sensor.chicken_comfort'') in [''Very cold'', ''Chilly'', ''Warm'', ''Hot'', ''Heat danger''] }}'
          message: 'Hens: {{ states(''sensor.chicken_comfort'') | lower }}'
          text: 'Hens: {{ states(''sensor.chicken_comfort'') | lower }}'
          icon: mdi:egg
          iconColor: '{{ ''#3b82f6'' if states(''sensor.chicken_comfort'') in [''Very cold'', ''Chilly''] else ''#e5484d'' if states(''sensor.chicken_comfort'') == ''Heat danger'' else ''#f5a524'' }}'
          borderColor: '{{ ''#3b82f6'' if states(''sensor.chicken_comfort'') in [''Very cold'', ''Chilly''] else ''#e5484d'' if states(''sensor.chicken_comfort'') == ''Heat danger'' else ''#f5a524'' }}'
          messageColor: '#FFFFFF'
          textColor: '#FFFFFF'
          backgroundColor: '#99000000'
          shape: rounded
    - repeat:
        for_each: []
        sequence:
        - if:
          - condition: template
            value_template: '{{ states(repeat.item.adb) not in [''off'', ''standby'', ''unavailable'', ''unknown''] }}'
          then:
          - variables:
              host: '{{ repeat.item.host }}'
          - repeat:
              for_each: '{{ badges }}'
              sequence:
              - action: rest_command.tvoverlay_fixed
                data:
                  host: '{{ host }}'
                  payload: '{{ repeat.item }}'
                continue_on_error: true
automation:
- id: tv_overlay_watchdog
  alias: 'TVs: keep TvOverlay running, refresh badges when a TV turns on'
  mode: parallel
  triggers:
  - trigger: state
    entity_id:
    - media_player.living_room_main_room_tv_adb
    - media_player.game_room_game_room_tv_adb
    - media_player.bedroom_bedroom_tv_adb
    from:
    - 'off'
    - standby
    - unavailable
    for: 00:00:10
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state not in [''off'', ''standby'', ''unavailable'', ''unknown''] }}'
  actions:
  - action: androidtv.adb_command
    target:
      entity_id: '{{ trigger.entity_id }}'
    data:
      command: pidof com.tabdeveloper.tvoverlay >/dev/null || (monkey -p com.tabdeveloper.tvoverlay -c android.intent.category.LEANBACK_LAUNCHER 1; sleep 4; input keyevent KEYCODE_HOME)
    continue_on_error: true
  - delay: 00:00:08
  - action: script.tv_badges
- id: tv_overlay_badges
  alias: 'TVs: refresh corner badges when they change'
  mode: queued
  max: 2
  triggers:
  - trigger: state
    entity_id:
    - sensor.household_alerts
    - input_select.washer_state
    - input_select.dryer_state
    - sensor.chicken_comfort
    - sensor.station_sky
  - trigger: time_pattern
    minutes: /10
  actions:
  - action: script.tv_badges
- id: tv_overlay_alert_popup
  alias: 'TVs: pop up new household alerts'
  mode: queued
  triggers:
  - trigger: state
    entity_id: sensor.household_alerts
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state not in [''All good'', ''unknown'', ''unavailable''] and trigger.from_state is not none and trigger.from_state.state not in [''unknown'', ''unavailable''] }}'
  actions:
  - action: script.tv_popup
    data:
      title: Needs attention
      message: '{{ trigger.to_state.state }}'
      small_icon: mdi:alert-circle
      large_icon: mdi:alert-circle
      color: '#e5484d'
      seconds: 15
      id: household_alert
- id: tv_overlay_laundry_popup
  alias: 'TVs: pop up when the laundry is done'
  mode: queued
  triggers:
  - trigger: state
    entity_id: input_select.washer_state
    from: Running
    to: Done
    id: washer
  - trigger: state
    entity_id: input_select.dryer_state
    from: Running
    to: Done
    id: dryer
  actions:
  - action: script.tv_popup
    data:
      title: '{{ ''Washer'' if trigger.id == ''washer'' else ''Dryer'' }} is done'
      message: '{{ ''Time to move it to the dryer'' if trigger.id == ''washer'' else ''Time to fold'' }}'
      small_icon: '{{ ''mdi:washing-machine'' if trigger.id == ''washer'' else ''mdi:tumble-dryer'' }}'
      large_icon: '{{ ''mdi:washing-machine'' if trigger.id == ''washer'' else ''mdi:tumble-dryer'' }}'
      color: '#3b82f6'
      seconds: 15
- id: tv_overlay_coop_popup
  alias: 'TVs: pop up when the hens are too hot or cold'
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.chicken_comfort
    to:
    - Very cold
    - Hot
    - Heat danger
    for: 00:10:00
  actions:
  - action: script.tv_popup
    data:
      title: Hens are {{ trigger.to_state.state | lower }}
      message: '{{ state_attr(''sensor.chicken_comfort'', ''note'') or '''' }}'
      small_icon: mdi:egg
      large_icon: mdi:egg
      color: '{{ ''#3b82f6'' if trigger.to_state.state == ''Very cold'' else ''#e5484d'' }}'
      seconds: 20
