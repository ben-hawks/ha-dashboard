# Wall tablet dashboard: the helpers, groups, and summary sensors the
# dashboard depends on. Loaded as a Home Assistant package (see docs/install.md).

# ---------------------------------------------------------------------------
# Plain-English states: "Safe"/"Unsafe" for the smoke alarms and
# "Connected"/"Disconnected" for the hub, instead of "Off"/"On".
# ---------------------------------------------------------------------------
homeassistant:
  customize:
    binary_sensor.combination_alarm_alarm_status: &safety
      device_class: safety
    binary_sensor.combination_alarm_2_alarm_status: *safety
    binary_sensor.combination_alarm_3_alarm_status: *safety
    binary_sensor.combination_alarm_4_alarm_status: *safety
    binary_sensor.combination_alarm_5_alarm_status: *safety
    binary_sensor.work_office_base_station_alarm_status: *safety
    binary_sensor.base_station_connected:
      device_class: connectivity

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
input_select:
  wall_tablet_theme_mode:
    name: Tablet theme
    icon: mdi:theme-light-dark
    # The first option is the default on a fresh install.
    options:
      - Dark
      - Auto
      - Light

# ---------------------------------------------------------------------------
# Weather radar on Outdoors: swaps in for the forecast while this is on.
# ---------------------------------------------------------------------------
input_boolean:
  outdoors_radar:
    name: Show weather radar
    icon: mdi:radar
  # Off while someone works on a tablet outside Fully Kiosk, so the
  # watchdog below doesn't keep pulling the dashboard back up.
  tablet_watchdog:
    name: Tablet watchdog
    icon: mdi:shield-refresh-outline
    initial: true

# ---------------------------------------------------------------------------
# Hidden alerts: keys of alerts someone tapped away (script.alerts_hide).
# An alert stays hidden until it clears; when it comes back, it shows again.
# ---------------------------------------------------------------------------
input_text:
  alerts_hidden:
    name: Hidden alerts
    icon: mdi:bell-off-outline
    max: 255

automation:
  - id: wall_tablet_alerts_forget_cleared
    alias: "Alerts: forget hidden alerts once they clear"
    description: >-
      Drops an alert from the hidden list as soon as it's no longer active,
      so the next time it happens (e.g. a bed dries out again) it shows.
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.household_alert_items
        attribute: items
    variables:
      active: >-
        {{ (state_attr('sensor.household_alert_items', 'items') or [])
           | map(attribute='key') | list }}
      hidden: >-
        {{ states('input_text.alerts_hidden').split(',') | reject('eq', '') | list }}
      keep: "{{ hidden | select('in', active) | join(',') }}"
    conditions:
      - condition: template
        value_template: "{{ keep != hidden | join(',') }}"
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.alerts_hidden
        data:
          value: "{{ keep }}"

  - id: wall_tablet_apply_theme
    alias: "Dashboards: apply light/dark theme"
    description: >-
      Makes Aurora Dark or Aurora Light Home Assistant's default theme. Auto =
      light while the sun is up, dark after sunset. Every screen that uses
      the default theme (both tablets, unless a user picked their own theme
      in their profile) switches at once.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.wall_tablet_theme_mode
      - trigger: state
        entity_id: sun.sun
        to:
          - above_horizon
          - below_horizon
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          theme: >-
            {% set m = states('input_select.wall_tablet_theme_mode') %}
            {% set dark = m == 'Dark' or (m not in ['Dark', 'Light']
                                          and is_state('sun.sun', 'below_horizon')) %}
            {{ 'Aurora Dark' if dark else 'Aurora Light' }}
      # Set it as both the light-mode and dark-mode default, so it applies
      # whatever the device's own dark-mode setting is.
      - action: frontend.set_theme
        data:
          name: "{{ theme }}"
          mode: light
      - action: frontend.set_theme
        data:
          name: "{{ theme }}"
          mode: dark

  # Day = sun up, night = sun down. To use fixed times instead, swap the two
  # sun triggers for `trigger: time` and change `night` below to match.
  - id: hallway_lights_day_night
    alias: "Hallway lights: white by day, dim and warm at night"
    description: >-
      Switches the hallway lights on at sunrise (100%, neutral white) and
      sunset (25%, warm) while someone's home, and when the first person
      gets home. Whenever they're turned on in between, including the bulbs
      coming back after the wall switch, they come on with the right
      setting. After a restart, they're corrected only if already on.
    mode: restart
    triggers:
      - trigger: sun
        event: sunrise
        id: switch_on
      - trigger: sun
        event: sunset
        id: switch_on
      # First person home again: restore the lights the away automation
      # turned off.
      - trigger: state
        entity_id: zone.home
        from: "0"
        id: switch_on
      - trigger: state
        entity_id: light.hallway_lights
        to: "on"
        id: turned_on
      - trigger: homeassistant
        event: start
        id: correct_if_on
    conditions:
      # Don't switch them on at sunrise/sunset while nobody's home, and after
      # a restart only correct them if they're already on.
      - condition: template
        value_template: >-
          {{ (trigger.id != 'switch_on' or states('zone.home') | int(0) > 0)
             and (trigger.id != 'correct_if_on' or is_state('light.hallway_lights', 'on')) }}
    actions:
      - variables:
          night: "{{ is_state('sun.sun', 'below_horizon') }}"
      - action: light.turn_on
        target:
          entity_id: light.hallway_lights
        data:
          brightness_pct: "{{ 25 if night else 100 }}"
          color_temp_kelvin: "{{ 2700 if night else 4000 }}"
          transition: "{{ 30 if trigger.id == 'switch_on' else 0 }}"
        # Some hallway bulbs may be offline; don't fail on them.
        continue_on_error: true

  # zone.home's state is the number of people at home. Uses Home Assistant
  # floors (Settings → Areas), so a new light on either floor is covered
  # automatically. The floor IDs must match yours.
  #
  # Before switching off, the lights that were on are saved to a temporary
  # scene so the welcome-home automation below can put them back. The
  # hallway is left out of the snapshot: its own automation decides how it
  # comes back on.
  - id: everyone_away_lights_off
    alias: "Everyone away: upstairs and basement lights off"
    description: >-
      When nobody has been home for 10 minutes, remember which upstairs and
      basement lights were on, then turn them all off.
    mode: single
    triggers:
      - trigger: state
        entity_id: zone.home
        to: "0"
        for:
          minutes: 10
    actions:
      - variables:
          hallway: >-
            {{ ['light.hallway_lights']
               + (state_attr('light.hallway_lights', 'entity_id') or []) }}
          lights_on: >-
            {{ (floor_entities('upstairs') + floor_entities('basement'))
               | select('match', 'light\.')
               | reject('in', hallway)
               | select('is_state', 'on')
               | list }}
      - if: "{{ lights_on | count > 0 }}"
        then:
          - action: scene.create
            data:
              scene_id: away_lights_snapshot
              snapshot_entities: "{{ lights_on }}"
      - action: light.turn_off
        target:
          floor_id:
            - upstairs
            - basement
        continue_on_error: true

  # The snapshot only lives in memory, so if Home Assistant restarts while
  # you're out there's nothing to restore and this does nothing.
  - id: welcome_home_restore_lights
    alias: "Welcome home: restore upstairs and basement lights"
    description: >-
      When the first person gets home, turn back on the lights that were on
      when everyone left (hallway excluded), then forget the snapshot.
    mode: single
    triggers:
      - trigger: state
        entity_id: zone.home
        from: "0"
    conditions:
      - condition: template
        value_template: >-
          {{ 'scene.away_lights_snapshot'
             in states.scene | map(attribute='entity_id') | list }}
    actions:
      - action: scene.turn_on
        target:
          entity_id: scene.away_lights_snapshot
        continue_on_error: true
      - action: scene.delete
        target:
          entity_id: scene.away_lights_snapshot

  - id: outdoors_radar_auto
    alias: "Outdoors: show the radar in stormy weather"
    description: >-
      Brings up the radar in place of the forecast when rain, snow or storms
      are here or due within a few hours (binary_sensor.stormy_weather), and
      puts the forecast back 10 minutes after it clears. A radar opened by
      tapping the forecast closes itself after 10 minutes in dry weather.
      Closing it during a storm keeps it closed until the next storm.
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.stormy_weather
        from: "off"
        to: "on"
        id: storm
      - trigger: state
        entity_id: binary_sensor.stormy_weather
        to: "off"
        for: "00:10:00"
        id: clear
      - trigger: state
        entity_id: input_boolean.outdoors_radar
        to: "on"
        for: "00:10:00"
        id: timeout
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: storm
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.outdoors_radar
          - conditions:
              - condition: state
                entity_id: binary_sensor.stormy_weather
                state: "off"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.outdoors_radar

  # -------------------------------------------------------------------------
  # Tablets (Fully Kiosk): keep the dashboard up for days on end. Works for
  # every tablet added with the Fully Kiosk Browser integration; their
  # buttons are found by name, so nothing here needs your entity IDs.
  # -------------------------------------------------------------------------
  - id: tablets_nightly_browser_restart
    alias: "Tablets: reboot every night"
    description: >-
      The dashboard slowly uses up a small tablet's memory over a few days
      (the 3D floor plan, cameras) until the browser crashes, and keeps
      crashing until the tablet restarts. A reboot each night clears it
      (about a minute). Rebooting needs Fully Kiosk to be the tablet's device
      owner (docs/tablet-setup.md); without that, the browser is restarted.
    mode: single
    triggers:
      - trigger: time
        at: "03:45:00"
    variables:
      fully: "{{ integration_entities('fully_kiosk') | reject('is_state', 'unavailable') | list }}"
      restart: >-
        {{ fully | select('match', 'button\..*_restart_browser$') | list }}
      reboot: >-
        {{ fully | select('match', 'button\..*_reboot_device$') | list }}
    conditions:
      - condition: template
        value_template: "{{ restart | count + reboot | count > 0 }}"
    actions:
      # The restart first: it's all that happens if rebooting isn't allowed.
      - action: button.press
        target:
          entity_id: "{{ restart }}"
        continue_on_error: true
      - delay: "00:00:30"
      - action: button.press
        target:
          entity_id: "{{ reboot }}"
        continue_on_error: true

  - id: tablets_watchdog
    alias: "Tablets: bring the dashboard back if Fully Kiosk isn't in front"
    description: >-
      Checks each tablet every minute. If something other than Fully Kiosk
      has been in front for 3 minutes (a crash dropped it to the home
      screen, or a pop-up took over), it's brought back to the front; after
      6 minutes the browser is restarted, and after 12 the tablet reboots
      (once a browser crash starts, it tends to repeat until a reboot).
      Turn "Tablet watchdog" off on the Devices tab while working on a
      tablet.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: /1
    conditions:
      - condition: state
        entity_id: input_boolean.tablet_watchdog
        state: "on"
    actions:
      - repeat:
          for_each: >-
            {{ integration_entities('fully_kiosk') | select('match', 'sensor\..*_foreground_app$')
               | list }}
          sequence:
            - variables:
                app: "{{ states(repeat.item) }}"
                away: >-
                  {{ (now() - states[repeat.item].last_changed).total_seconds() / 60
                     if states[repeat.item] is not none else 0 }}
                device: "{{ device_id(repeat.item) }}"
                front: >-
                  {{ device_entities(device) | select('match', 'button\..*_bring_to_foreground$')
                     | first | default('') }}
                restart: >-
                  {{ device_entities(device) | select('match', 'button\..*_restart_browser$')
                     | first | default('') }}
                reboot: >-
                  {{ device_entities(device) | select('match', 'button\..*_reboot_device$')
                     | first | default('') }}
            - choose:
                # Fully's own app (de.ozerov.fully) is in front: all good.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ app in ['unknown', 'unavailable', ''] or 'ozerov.fully' in app }}
                  sequence: []
                # Rebooting takes a minute or two, which resets "away".
                - conditions:
                    - condition: template
                      value_template: "{{ away >= 12 and reboot != '' }}"
                  sequence:
                    - action: button.press
                      target:
                        entity_id: "{{ reboot }}"
                      continue_on_error: true
                - conditions:
                    - condition: template
                      value_template: "{{ 6 <= away < 7 and restart != '' }}"
                  sequence:
                    - action: button.press
                      target:
                        entity_id: "{{ restart }}"
                      continue_on_error: true
                - conditions:
                    - condition: template
                      value_template: "{{ 3 <= away < 4 and front != '' }}"
                  sequence:
                    - action: button.press
                      target:
                        entity_id: "{{ front }}"
                      continue_on_error: true

  - id: tablets_watchdog_back_on
    alias: "Tablets: turn the watchdog back on after an hour"
    description: In case someone forgets after working on a tablet.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.tablet_watchdog
        to: "off"
        for: "01:00:00"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.tablet_watchdog

# ---------------------------------------------------------------------------
# Light groups (one tile controls a whole room)
# ---------------------------------------------------------------------------
light:
  - platform: group
    name: Hallway Lights
    unique_id: wall_tablet_hallway_lights
    entities:
      - light.hallway_hallway_light_1
      - light.hallway_hallway_light_2
      - light.hallway_hallway_light_3
      - light.smart_multicolor_bulb_9

  - platform: group
    name: Garage Lights
    unique_id: wall_tablet_garage_lights
    entities:
      - light.smart_multicolor_bulb_2
      - light.smart_multicolor_bulb_5
      - light.smart_multicolor_bulb_6
      - light.smart_multicolor_bulb_8

  - platform: group
    name: Ben's Office Lamp
    unique_id: wall_tablet_ben_office_lamp
    entities:
      - light.smart_multicolor_bulb_3
      - light.smart_multicolor_bulb_4

# ---------------------------------------------------------------------------
# Smoke / CO: one "is anything going off?" sensor for every alarm
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: group
    name: Smoke and CO Alarms
    unique_id: wall_tablet_smoke_co_alarms
    device_class: safety
    entities:
      - binary_sensor.combination_alarm_alarm_status
      - binary_sensor.combination_alarm_2_alarm_status
      - binary_sensor.combination_alarm_3_alarm_status
      - binary_sensor.combination_alarm_4_alarm_status
      - binary_sensor.combination_alarm_5_alarm_status
      - binary_sensor.work_office_base_station_alarm_status

script:
  # Hide one alert until it clears (tap an alert on the Home tab).
  alerts_hide:
    alias: Hide an alert until it happens again
    icon: mdi:bell-off-outline
    mode: queued
    fields:
      key:
        description: The alert's key (sensor.household_alert_items)
        example: garden_2
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.alerts_hidden
        data:
          value: >-
            {%- set hidden = states('input_text.alerts_hidden').split(',')
                  | reject('eq', '') | list %}
            {{ (hidden + [key]) | unique | join(',') }}

  # Show every hidden alert again.
  alerts_unhide_all:
    alias: Show hidden alerts again
    icon: mdi:bell-ring-outline
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.alerts_hidden
        data:
          value: ""

  wall_tablet_all_lights_off:
    alias: All lights off
    icon: mdi:lightbulb-group-off
    sequence:
      - action: light.turn_off
        target:
          entity_id: all

  wall_tablet_silence_alarms:
    alias: Silence smoke alarms
    icon: mdi:volume-off
    sequence:
      - action: button.press
        target:
          entity_id:
            - button.living_room_combination_alarm_mute
            - button.bedroom_combination_alarm_2_mute
            - button.office_combination_alarm_3_mute
            - button.meg_s_office_combination_alarm_4_mute
            - button.kitchen_combination_alarm_5_mute

# ---------------------------------------------------------------------------
# Summary sensors. These discover new devices on their own, so most new
# hardware shows up here without editing this file.
# ---------------------------------------------------------------------------
# Inputs for "Shed Battery Time To Full". First, how much the shed
# battery's charge rose (or fell) over the last hour, in percentage points:
# its charging rate in %/h when charging from the wall.
sensor:
  - platform: statistics
    name: Shed Battery Change Last Hour
    unique_id: shed_battery_change_last_hour
    entity_id: sensor.shed_battery
    state_characteristic: change
    max_age:
      hours: 1
    sampling_size: 240
  # Solar input averaged over 15 minutes, so a passing cloud doesn't swing
  # the time-to-full estimate.
  - platform: statistics
    name: Shed Solar Input 15 min
    unique_id: shed_solar_input_15_min
    entity_id: sensor.shed_el30v2_el30v22533005590342_photovoltaics_input_power
    state_characteristic: mean
    max_age:
      minutes: 15
    sampling_size: 240
    keep_last_sample: true

template:
  # Weather station helper sensors (sensor.station_*), generated by
  # tools/weather.py. Kept outside packages/ so they aren't mistaken for a
  # package if the folder is loaded with !include_dir_named.
  - !include ../templates/weather_station.yaml
  # Hourly and daily forecasts for the Outdoors forecast table (tools/weather.py).
  - !include ../templates/forecast.yaml
  # Coop helpers: coop temperature/humidity, chicken comfort, scene sky and glow (tools/coop.py).
  - !include ../templates/coop.yaml
  - sensor:
      - name: Lights On
        unique_id: wall_tablet_lights_on
        icon: mdi:lightbulb-group
        # Light groups carry an entity_id attribute; skip them so bulbs
        # aren't counted twice.
        state: >-
          {{ states.light
             | rejectattr('attributes.entity_id', 'defined')
             | selectattr('state', 'eq', 'on')
             | list | count }}

      # The shed power station (Bluetti EL30V2). Its entity IDs change when
      # the device is re-added, so these find its readings by serial number
      # and give the dashboard fixed IDs.
      - name: Shed Battery
        unique_id: shed_battery
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        availability: >-
          {{ states.sensor | selectattr('entity_id', 'search', 'el30v22533005590342')
             | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'eq', 'battery')
             | selectattr('state', 'is_number') | list | count > 0 }}
        state: >-
          {{ states.sensor | selectattr('entity_id', 'search', 'el30v22533005590342')
             | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'eq', 'battery')
             | selectattr('state', 'is_number')
             | map(attribute='state') | first }}

      # Battery time left in words (2748 min → 45 hours, 48 minutes).
      - name: Shed Battery Time Left
        unique_id: shed_battery_time_left
        icon: mdi:timer-sand
        availability: >-
          {{ states.sensor | selectattr('entity_id', 'search', 'el30v22533005590342.*(battery_time|time_remaining|remaining_time)')
             | selectattr('state', 'is_number') | list | count > 0 }}
        state: >-
          {%- set m = states.sensor
                | selectattr('entity_id', 'search', 'el30v22533005590342.*(battery_time|time_remaining|remaining_time)')
                | selectattr('state', 'is_number')
                | map(attribute='state') | first | int(0) %}
          {%- set h, mm = m // 60, m % 60 %}
          {%- set hours = h ~ (' hour' if h == 1 else ' hours') %}
          {%- set minutes = mm ~ (' minute' if mm == 1 else ' minutes') %}
          {{ (hours ~ ', ' ~ minutes) if h else minutes }}

      # What the shed is using (AC + DC outlets), and solar in minus that:
      # positive = the battery is gaining, negative = it's draining.
      - name: Shed Power Draw
        unique_id: shed_power_draw
        icon: mdi:power-plug-outline
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ states('sensor.shed_el30v2_el30v22533005590342_alternating_current_out_power') | is_number and states('sensor.shed_el30v2_el30v22533005590342_direct_current_out_power') | is_number }}"
        state: "{{ (states('sensor.shed_el30v2_el30v22533005590342_alternating_current_out_power') | float + states('sensor.shed_el30v2_el30v22533005590342_direct_current_out_power') | float) | round(0) }}"
      - name: Shed Net Power
        unique_id: shed_net_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: >-
          {{ 'mdi:battery-arrow-up' if this.state | float(0) > 0
             else 'mdi:battery-arrow-down' if this.state | float(0) < 0
             else 'mdi:battery-outline' }}
        availability: >-
          {{ states('sensor.shed_el30v2_el30v22533005590342_photovoltaics_input_power') | is_number and states('sensor.shed_el30v2_el30v22533005590342_alternating_current_out_power') | is_number
             and states('sensor.shed_el30v2_el30v22533005590342_direct_current_out_power') | is_number }}
        state: >-
          {{ (states('sensor.shed_el30v2_el30v22533005590342_photovoltaics_input_power') | float - states('sensor.shed_el30v2_el30v22533005590342_alternating_current_out_power') | float
               - states('sensor.shed_el30v2_el30v22533005590342_direct_current_out_power') | float) | round(0) }}

      # Estimated time until the shed battery is full.
      # On solar: from the last 15 minutes' solar input, the shed's AC and
      # DC draw right now, and the sun's path: solar is assumed to follow
      # the sun (strongest at midday, nothing at sunset; sun times come from
      # the Home zone), stepped forward 10 minutes at a time. If it won't be
      # full by sunset it says so, with the charge expected by then.
      # Otherwise (charging from the wall): from how fast the charge rose
      # over the last hour.
      # Battery: 288 Wh (Bluetti Elite 30 V2). Charging ~95% efficient, the
      # inverter ~88% (AC draw costs the battery a bit more than it reads).
      - name: Shed Battery Time To Full
        unique_id: shed_battery_time_to_full
        icon: mdi:battery-charging-high
        availability: "{{ states('sensor.shed_battery') | is_number }}"
        state: >-
          {%- set capacity = 288 %}
          {%- set soc = states('sensor.shed_battery') | float(0) %}
          {%- set need = (100 - soc) / 100 * capacity %}
          {%- set solar = states('sensor.shed_solar_input_15_min') | float(0) %}
          {%- set load = states('sensor.shed_el30v2_el30v22533005590342_alternating_current_out_power') | float(0) / 0.88
                        + states('sensor.shed_el30v2_el30v22533005590342_direct_current_out_power') | float(0) %}
          {%- set rate = states('sensor.shed_battery_change_last_hour') | float(0) %}
          {%- set ns = namespace(minutes=none, by_sunset=none) %}
          {%- if soc >= 100 %}
            {%- set ns.minutes = 0 %}
          {%- elif is_state('sun.sun', 'above_horizon') and solar * 0.95 > load + 2 %}
            {%- set sunset = as_datetime(state_attr('sun.sun', 'next_setting')) %}
            {%- set sunrise = as_datetime(state_attr('sun.sun', 'next_rising')) - timedelta(days=1) %}
            {%- set day = (sunset - sunrise).total_seconds() %}
            {%- set shape_now = [sin(pi * (now() - sunrise).total_seconds() / day), 0.15] | max %}
            {%- set peak = solar / shape_now %}
            {%- set sim = namespace(stored=0, done=false) %}
            {%- for step in range(1, 145) %}
              {%- set t = now() + timedelta(minutes=10 * step) %}
              {%- if not sim.done %}
                {%- if t >= sunset %}
                  {%- set sim.done = true %}
                  {%- set ns.by_sunset = [soc + [sim.stored, 0] | max / capacity * 100, 99] | min %}
                {%- else %}
                  {%- set sun_now = [sin(pi * (t - sunrise).total_seconds() / day), 0] | max %}
                  {%- set sim.stored = sim.stored + (peak * sun_now * 0.95 - load) / 6 %}
                  {%- if sim.stored >= need %}
                    {%- set sim.done = true %}
                    {%- set ns.minutes = 10 * step %}
                  {%- endif %}
                {%- endif %}
              {%- endif %}
            {%- endfor %}
          {%- elif rate >= 1 %}
            {%- set ns.minutes = ((100 - soc) / rate * 60) | round(0) | int %}
          {%- endif %}
          {%- if ns.minutes == 0 %}Full
          {%- elif ns.minutes is not none %}
            {%- set h, m = ns.minutes // 60, ns.minutes % 60 %}
            {%- set hrs = h ~ (' hour' if h == 1 else ' hours') %}
            {%- set mins = m ~ (' minute' if m == 1 else ' minutes') %}
            {{- (hrs ~ ', ' ~ mins) if h else mins }}
          {%- elif ns.by_sunset is not none %}
            {{- 'Not today (' ~ ns.by_sunset | round(0) | int ~ '% by sunset)' }}
          {%- else %}Not charging
          {%- endif %}

      # Battery sensors below 20%. Phones and power stations are left out
      # by name; tag anything else with the "Hide from tablet" label in
      # Home Assistant to leave it out too.
      - name: Low Batteries
        unique_id: wall_tablet_low_batteries
        icon: mdi:battery-alert-variant-outline
        state: >-
          {%- set hidden = label_entities('hide_from_tablet') %}
          {{ states.sensor
             | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'eq', 'battery')
             | rejectattr('entity_id', 'search', 'pixel|xperia|ecoflow|el30v|shed_battery|meshtastic')
             | rejectattr('entity_id', 'in', hidden)
             | selectattr('state', 'is_number')
             | map(attribute='state') | map('float')
             | select('lt', 20)
             | list | count }}
        attributes:
          entities: >-
            {%- set hidden = label_entities('hide_from_tablet') %}
            {%- set ns = namespace(found=[]) %}
            {%- for s in states.sensor
                 | selectattr('attributes.device_class', 'defined')
                 | selectattr('attributes.device_class', 'eq', 'battery')
                 | rejectattr('entity_id', 'search', 'pixel|xperia|ecoflow|el30v|shed_battery|meshtastic')
                 | rejectattr('entity_id', 'in', hidden)
                 if s.state | is_number and s.state | float < 20 %}
              {%- set ns.found = ns.found + [s.entity_id] %}
            {%- endfor %}
            {{ ns.found }}

      - name: Highest CO Reading
        unique_id: wall_tablet_highest_co
        icon: mdi:molecule-co
        unit_of_measurement: ppm
        device_class: carbon_monoxide
        state_class: measurement
        state: >-
          {%- set readings = [
               'sensor.combination_alarm_carbon_monoxide',
               'sensor.combination_alarm_2_carbon_monoxide',
               'sensor.combination_alarm_3_carbon_monoxide',
               'sensor.combination_alarm_4_carbon_monoxide',
               'sensor.combination_alarm_5_carbon_monoxide',
             ] | map('states') | select('is_number') | map('float') | list %}
          {{ readings | max if readings else 0 }}

      # One line of plain English for the home screen. "All good" when
      # nothing needs doing; the dashboard hides the alert banner then.
      # To add a new kind of alert, add another `if` block below.
      # Every active alert as its own item: key (stable, used to hide it),
      # text, icon, and critical (safety alerts can't be hidden). The state
      # is just a label; the list is the "items" attribute.
      - name: Household Alert Items
        unique_id: wall_tablet_household_alert_items
        icon: mdi:format-list-bulleted
        state: Alert list
        attributes:
          items: >-
            {%- set ns = namespace(a=[]) %}
            {%- if is_state('binary_sensor.smoke_and_co_alarms', 'on') %}
              {%- set ns.a = ns.a + [{'key': 'smoke', 'text': 'Smoke/CO alarm is going off',
                                      'icon': 'mdi:smoke-detector-alert', 'critical': true}] %}
            {%- endif %}
            {%- if states('sensor.highest_co_reading') | float(0) >= 10 %}
              {%- set ns.a = ns.a + [{'key': 'co', 'icon': 'mdi:molecule-co', 'critical': true,
                                      'text': 'CO detected (' ~ states('sensor.highest_co_reading') ~ ' ppm)'}] %}
            {%- endif %}
            {%- if is_state('binary_sensor.base_station_connected', 'off') %}
              {%- set ns.a = ns.a + [{'key': 'smoke_hub', 'text': 'Smoke alarm hub is offline',
                                      'icon': 'mdi:smoke-detector-off', 'critical': true}] %}
            {%- endif %}
            {%- if ['binary_sensor.combination_alarm_is_life_end',
                    'binary_sensor.combination_alarm_2_is_life_end',
                    'binary_sensor.combination_alarm_3_is_life_end',
                    'binary_sensor.combination_alarm_4_is_life_end',
                    'binary_sensor.combination_alarm_5_is_life_end']
                  | select('is_state', 'on') | list | count > 0 %}
              {%- set ns.a = ns.a + [{'key': 'alarm_life', 'text': 'A smoke alarm needs replacing',
                                      'icon': 'mdi:smoke-detector-variant-alert', 'critical': false}] %}
            {%- endif %}
            {#- The count is in the key: another battery going low shows again. #}
            {%- set low = states('sensor.low_batteries') | int(0) %}
            {%- if low > 0 %}
              {%- set ns.a = ns.a + [{'key': 'batteries_' ~ low, 'icon': 'mdi:battery-alert-variant-outline',
                                      'critical': false,
                                      'text': low ~ (' battery is' if low == 1 else ' batteries are') ~ ' low'}] %}
            {%- endif %}
            {%- if states('sensor.turd_gobbler_9001_waste_drawer') | float(0) >= 80 %}
              {%- set ns.a = ns.a + [{'key': 'litter', 'text': 'Litter box drawer is full',
                                      'icon': 'mdi:cat', 'critical': false}] %}
            {%- endif %}
            {#- Finished loads nobody has emptied yet (packages/laundry.yaml). #}
            {%- if is_state('input_select.washer_state', 'Done') %}
              {%- set ns.a = ns.a + [{'key': 'washer', 'text': 'Washer is done',
                                      'icon': 'mdi:washing-machine', 'critical': false}] %}
            {%- endif %}
            {%- if is_state('input_select.dryer_state', 'Done') %}
              {%- set ns.a = ns.a + [{'key': 'dryer', 'text': 'Dryer is done',
                                      'icon': 'mdi:tumble-dryer', 'critical': false}] %}
            {%- endif %}
            {%- if is_state('vacuum.acearchr_gmail_com', 'error') %}
              {%- set ns.a = ns.a + [{'key': 'vacuum', 'text': 'Vacuum is stuck',
                                      'icon': 'mdi:robot-vacuum-alert', 'critical': false}] %}
            {%- endif %}
            {#- Dry garden beds, one each (packages/garden.yaml). #}
            {%- for c in state_attr('sensor.garden_needs_water', 'beds') or [] %}
              {%- set ns.a = ns.a + [{'key': 'garden_' ~ c, 'icon': 'mdi:watering-can', 'critical': false,
                                      'text': states('sensor.garden_' ~ c ~ '_name') ~ ' needs water'}] %}
            {%- endfor %}
            {#- A drip pump that's stuck: no rise after watering, no power, no readings (packages/drip.yaml). #}
            {%- for z in state_attr('sensor.drip_problems', 'items') or [] %}
              {%- set ns.a = ns.a + [{'key': 'drip_' ~ z.zone, 'icon': 'mdi:water-pump-off', 'critical': false,
                                      'text': z.text}] %}
            {%- endfor %}
            {%- if states('sensor.dockstream_2_smart_cordless_fountain_remaining_water_2') | float(100) < 25 %}
              {%- set ns.a = ns.a + [{'key': 'fountain_water', 'text': 'Cat fountain needs water',
                                      'icon': 'mdi:fountain', 'critical': false}] %}
            {%- endif %}
            {%- if states('sensor.dockstream_2_smart_cordless_fountain_remaining_filter_day') | float(99) <= 2 %}
              {%- set ns.a = ns.a + [{'key': 'fountain_filter', 'text': 'Cat fountain filter needs replacing',
                                      'icon': 'mdi:air-filter', 'critical': false}] %}
            {%- endif %}
            {%- if states('sensor.dockstream_2_smart_cordless_fountain_remaining_cleaning_days') | float(99) <= 1 %}
              {%- set ns.a = ns.a + [{'key': 'fountain_clean', 'text': 'Cat fountain needs cleaning',
                                      'icon': 'mdi:spray-bottle', 'critical': false}] %}
            {%- endif %}
            {{ ns.a }}

      # The alerts that aren't hidden (input_text.alerts_hidden, see
      # script.alerts_hide), joined into one line for the banner and the TVs.
      # "items" / "keys": the same, as a list, for the dashboard's tiles.
      - name: Household Alerts
        unique_id: wall_tablet_household_alerts
        icon: mdi:alert-circle-outline
        state: >-
          {%- set hidden = states('input_text.alerts_hidden').split(',') %}
          {%- set ns = namespace(s=[]) %}
          {%- for i in state_attr('sensor.household_alert_items', 'items') or [] %}
            {%- if i.critical or i.key not in hidden %}{% set ns.s = ns.s + [i] %}{% endif %}
          {%- endfor %}
          {{ (ns.s | map(attribute='text') | join(' · ') if ns.s else 'All good')[:250] }}
        attributes:
          items: >-
            {%- set hidden = states('input_text.alerts_hidden').split(',') %}
            {%- set ns = namespace(s=[]) %}
            {%- for i in state_attr('sensor.household_alert_items', 'items') or [] %}
              {%- if i.critical or i.key not in hidden %}{% set ns.s = ns.s + [i] %}{% endif %}
            {%- endfor %}
            {{ ns.s }}
          keys: >-
            {%- set hidden = states('input_text.alerts_hidden').split(',') %}
            {%- set ns = namespace(s=[]) %}
            {%- for i in state_attr('sensor.household_alert_items', 'items') or [] %}
              {%- if i.critical or i.key not in hidden %}{% set ns.s = ns.s + [i.key] %}{% endif %}
            {%- endfor %}
            {{ ns.s }}
          hidden: >-
            {%- set hidden = states('input_text.alerts_hidden').split(',') %}
            {{ (state_attr('sensor.household_alert_items', 'items') or [])
               | rejectattr('critical') | selectattr('key', 'in', hidden) | list | count }}
