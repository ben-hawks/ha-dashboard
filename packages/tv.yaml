# GENERATED by tools/tv.py: edit TVS there and re-run, don't edit this
# file by hand.
automation:
- id: tv_media_session_poll
  alias: 'TVs: read what''s playing (media sessions over ADB)'
  description: Generated by tools/tv.py. Asks each TV that's on what its apps are playing, every 20 seconds.
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: time_pattern
    seconds: /20
  actions:
  - repeat:
      for_each:
      - media_player.living_room_main_room_tv_adb
      - media_player.game_room_game_room_tv_adb
      - media_player.bedroom_bedroom_tv_adb
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(repeat.item) not in [''off'', ''unavailable'', ''unknown''] }}'
        then:
        - action: androidtv.adb_command
          target:
            entity_id: '{{ repeat.item }}'
          data:
            command: dumpsys media_session | grep -E 'package=|active=|state=PlaybackState|description=' | sed -E 's/, position=.*//'; echo done
          continue_on_error: true
template:
- triggers:
  - trigger: state
    entity_id: media_player.living_room_main_room_tv_adb
    attribute: adb_response
  - trigger: state
    entity_id: media_player.living_room_main_room_tv_adb
    to:
    - 'off'
    - unavailable
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state in [''off'', ''unavailable''] or (trigger.to_state.attributes.get(''adb_response'') or '''') != '''' }}'
  sensor:
  - name: TV Main Room TV Session
    unique_id: tv_main_room_tv_session
    icon: mdi:television-play
    state: '{%- set lines = (trigger.to_state.attributes.get(''adb_response'') or '''').split(''\n'') %}{%- set ns = namespace(sessions=[], cur={}) %}{%- for raw in lines %}{%- set l = raw | trim %}{%- if l.startswith(''package='') %}{%- if ns.cur %}{%- set ns.sessions = ns.sessions + [ns.cur] %}{%- endif %}{%- set ns.cur = {''package'': l[8:], ''state'': 0, ''description'': ''''} %}{%- elif ''state=PlaybackState {state='' in l %}{%- set ns.cur = dict(ns.cur, state=l.split(''state=PlaybackState {state='')[1].split('','')[0] | int(0)) %}{%- elif ''description='' in l %}{%- set ns.cur = dict(ns.cur, description=l.split(''description='', 1)[1]) %}{%- endif %}{%- endfor %}{%- if ns.cur %}{%- set ns.sessions = ns.sessions + [ns.cur] %}{%- endif %}{%- set pick = (ns.sessions | selectattr(''state'', ''eq'', 3) | list + ns.sessions | selectattr(''state'', ''in'', [2, 6]) | list + [{}]) | first %}{%- set parts = (pick.description or '''').split('', '') %}{{ ''playing'' if pick.state == 3 else ''paused'' if pick.state in [2, 6] else ''idle'' }}'
    attributes:
      title: '{%- set lines = (trigger.to_state.attributes.get(''adb_response'') or '''').split(''\n'') %}{%- set ns = namespace(sessions=[], cur={}) %}{%- for raw in lines %}{%- set l = raw | trim %}{%- if l.startswith(''package='') %}{%- if ns.cur %}{%- set ns.sessions = ns.sessions + [ns.cur] %}{%- endif %}{%- set ns.cur = {''package'': l[8:], ''state'': 0, ''description'': ''''} %}{%- elif ''state=PlaybackState {state='' in l %}{%- set ns.cur = dict(ns.cur, state=l.split(''state=PlaybackState {state='')[1].split('','')[0] | int(0)) %}{%- elif ''description='' in l %}{%- set ns.cur = dict(ns.cur, description=l.split(''description='', 1)[1]) %}{%- endif %}{%- endfor %}{%- if ns.cur %}{%- set ns.sessions = ns.sessions + [ns.cur] %}{%- endif %}{%- set pick = (ns.sessions | selectattr(''state'', ''eq'', 3) | list + ns.sessions | selectattr(''state'', ''in'', [2, 6]) | list + [{}]) | first %}{%- set parts = (pick.description or '''').split('', '') %}{{ parts[0] if parts[0] not in ['''', ''null''] else '''' }}'
      subtitle: '{%- set lines = (trigger.to_state.attributes.get(''adb_response'') or '''').split(''\n'') %}{%- set ns = namespace(sessions=[], cur={}) %}{%- for raw in lines %}{%- set l = raw | trim %}{%- if l.startswith(''package='') %}{%- if ns.cur %}{%- set ns.sessions = ns.sessions + [ns.cur] %}{%- endif %}{%- set ns.cur = {''package'': l[8:], ''state'': 0, ''description'': ''''} %}{%- elif ''state=PlaybackState {state='' in l %}{%- set ns.cur = dict(ns.cur, state=l.split(''state=PlaybackState {state='')[1].split('','')[0] | int(0)) %}{%- elif ''description='' in l %}{%- set ns.cur = dict(ns.cur, description=l.split(''description='', 1)[1]) %}{%- endif %}{%- endfor %}{%- if ns.cur %}{%- set ns.sessions = ns.sessions + [ns.cur] %}{%- endif %}{%- set pick = (ns.sessions | selectattr(''state'', ''eq'', 3) | list + ns.sessions | selectattr(''state'', ''in'', [2, 6]) | list + [{}]) | first %}{%- set parts = (pick.description or '''').split('', '') %}{{ parts[1] if parts | count > 1 and parts[1] not in ['''', ''null''] else '''' }}'
      app: '{%- set lines = (trigger.to_state.attributes.get(''adb_response'') or '''').split(''\n'') %}{%- set ns = namespace(sessions=[], cur={}) %}{%- for raw in lines %}{%- set l = raw | trim %}{%- if l.startswith(''package='') %}{%- if ns.cur %}{%- set ns.sessions = ns.sessions + [ns.cur] %}{%- endif %}{%- set ns.cur = {''package'': l[8:], ''state'': 0, ''description'': ''''} %}{%- elif ''state=PlaybackState {state='' in l %}{%- set ns.cur = dict(ns.cur, state=l.split(''state=PlaybackState {state='')[1].split('','')[0] | int(0)) %}{%- elif ''description='' in l %}{%- set ns.cur = dict(ns.cur, description=l.split(''description='', 1)[1]) %}{%- endif %}{%- endfor %}{%- if ns.cur %}{%- set ns.sessions = ns.sessions + [ns.cur] %}{%- endif %}{%- set pick = (ns.sessions | selectattr(''state'', ''eq'', 3) | list + ns.sessions | selectattr(''state'', ''in'', [2, 6]) | list + [{}]) | first %}{%- set parts = (pick.description or '''').split('', '') %}{{ (state_attr(''media_player.living_room_main_room_tv_adb'', ''app_name'') or pick.package) if not pick.package or state_attr(''media_player.living_room_main_room_tv_adb'', ''app_id'') == pick.package else pick.package }}'
