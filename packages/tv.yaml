      sessions: '{%- set lines = (trigger.to_state.attributes.get(''adb_response'') or '''').split(''\n'') %}{%- set ns = namespace(sessions=[], cur={}) %}{%- for raw in lines %}{%- set l = raw | trim %}{%- if l.startswith(''package='') %}{%- if ns.cur %}{%- set ns.sessions = ns.sessions + [ns.cur] %}{%- endif %}{%- set ns.cur = {''package'': l[8:], ''state'': 0, ''description'': ''''} %}{%- elif ''state=PlaybackState {state='' in l %}{%- set token = l.split(''state=PlaybackState {state='')[1].split('','')[0] | trim %}{%- set ns.cur = dict(ns.cur, raw_state=token, state=token.split(''('')[-1].rstrip('')'') | int(0)) %}{%- elif ''description='' in l %}{%- set ns.cur = dict(ns.cur, description=l.split(''description='', 1)[1]) %}{%- endif %}{%- endfor %}{%- if ns.cur %}{%- set ns.sessions = ns.sessions + [ns.cur] %}{%- endif %}{%- set pick = (ns.sessions | selectattr(''state'', ''eq'', 3) | list + ns.sessions | selectattr(''state'', ''in'', [2, 6]) | list + [{}]) | first %}{%- set parts = (pick.description or '''').split('', '') %}{%- set out = namespace(items=[]) %}{%- for x in ns.sessions %}{%- set out.items = out.items + [x.package ~ '' '' ~ (x.raw_state or ''?'')] %}{%- endfor %}{{ out.items | join(''; '') }}'
