      app: '{%- set lines = (trigger.to_state.attributes.get(''adb_response'') or '''').split(''\n'') %}{%- set ns = namespace(sessions=[], cur={}) %}{%- for raw in lines %}{%- set l = raw | trim %}{%- if l.startswith(''package='') %}{%- if ns.cur %}{%- set ns.sessions = ns.sessions + [ns.cur] %}{%- endif %}{%- set ns.cur = {''package'': l[8:], ''state'': 0, ''description'': ''''} %}{%- elif ''state=PlaybackState {state='' in l %}{%- set token = l.split(''state=PlaybackState {state='')[1].split('','')[0] | trim %}{%- set ns.cur = dict(ns.cur, raw_state=token, state=token.split(''('')[-1].rstrip('')'') | int(0)) %}{%- elif ''description='' in l %}{%- set ns.cur = dict(ns.cur, description=l.split(''description='', 1)[1]) %}{%- endif %}{%- endfor %}{%- if ns.cur %}{%- set ns.sessions = ns.sessions + [ns.cur] %}{%- endif %}{%- set media = ns.sessions | rejectattr(''package'', ''in'', [''com.google.android.apps.tv.launcherx'', ''com.spocky.projengmenu'', ''com.google.android.apps.tv.dreamx'', ''com.android.tv.settings'']) | list %}{%- set pick = (media | selectattr(''state'', ''eq'', 3) | list + media | selectattr(''state'', ''in'', [2, 6]) | list + [{''package'': '''', ''state'': 0, ''description'': ''''}]) | first %}{%- set parts = (pick.description or '''').split('', '') %}{%- set names = {''org.smarttube.beta'': ''SmartTube'', ''org.smarttube.stable'': ''SmartTube'', ''com.liskovsoft.smarttubetv.beta'': ''SmartTube'', ''com.liskovsoft.smarttubetv'': ''SmartTube'', ''com.google.android.youtube.tv'': ''YouTube'', ''com.netflix.ninja'': ''Netflix'', ''org.jellyfin.androidtv'': ''Jellyfin'', ''com.github.damontecres.wholphin'': ''Wholphin'', ''com.sling'': ''Sling TV'', ''com.collegehumor.chdropout'': ''Dropout'', ''ott.thetryguys'': ''2nd Try'', ''com.spotify.tv.android'': ''Spotify''} %}{%- set package = pick.package or state_attr(''media_player.living_room_main_room_tv_adb'', ''app_id'') or state_attr(''media_player.living_room_main_room_tv_adb'', ''app_name'') or '''