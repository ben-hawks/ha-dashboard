  garden_2_outdoors:
    name: Garden 2 outdoors
    icon: mdi:home-switch-outline
  garden_3_outdoors:
    name: Garden 3 outdoors
    icon: mdi:home-switch-outline
  garden_4_outdoors:
    name: Garden 4 outdoors
    icon: mdi:home-switch-outline
sensor:
- platform: statistics
  name: Garden Outdoor Temperature 24h
  unique_id: garden_outdoor_temperature_24h
  entity_id: sensor.station_temperature
  state_characteristic: mean
  max_age:
    hours: 24
  sampling_size: 3000
  keep_last_sample: true
template:
- sensor:
  - name: Garden Indoor Season
    unique_id: garden_indoor_season
    icon: mdi:home-thermometer-outline
    state: '{%- set rise = as_datetime(state_attr(''sun.sun'', ''next_rising'')) %}{%- set set_ = as_datetime(state_attr(''sun.sun'', ''next_setting'')) %}{%- if is_state(''sun.sun'', ''above_horizon'') %}{%- set rise = rise - timedelta(days=1) %}{%- endif %}{%- set hours = (set_ - rise).total_seconds() / 3600 %}{%- set pts = [[10, 0.75], [14, 1.0]] %}{%- set x = hours %}{%- set ns = namespace(y=pts[0][1]) %}{%- for i in range(pts | count) %}{%- if x >= pts[i][0] %}{% set ns.y = pts[i][1] %}{% endif %}{%- if i > 0 and pts[i - 1][0] <= x < pts[i][0] %}{%- set ns.y = pts[i - 1][1] + (x - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]) * (pts[i][1] - pts[i - 1][1]) %}{%- endif %}{%- endfor %}{{ ns.y | round(2) }}'
    attributes:
      daylight_hours: '{%- set rise = as_datetime(state_attr(''sun.sun'', ''next_rising'')) %}{%- set set_ = as_datetime(state_attr(''sun.sun'', ''next_setting'')) %}{%- if is_state(''sun.sun'', ''above_horizon'') %}{%- set rise = rise - timedelta(days=1) %}{%- endif %}{%- set hours = (set_ - rise).total_seconds() / 3600 %}{{ hours | round(1) }}'
      season: '{%- set rise = as_datetime(state_attr(''sun.sun'', ''next_rising'')) %}{%- set set_ = as_datetime(state_attr(''sun.sun'', ''next_setting'')) %}{%- if is_state(''sun.sun'', ''above_horizon'') %}{%- set rise = rise - timedelta(days=1) %}{%- endif %}{%- set hours = (set_ - rise).total_seconds() / 3600 %}{{ ''Short days, slow growth'' if hours < 11 else ''Growing'' }}'
  - name: Garden Outdoor Season
    unique_id: garden_outdoor_season
    icon: mdi:sun-thermometer-outline
    state: '{%- set t = states(''sensor.garden_outdoor_temperature_24h'') | float(states(''sensor.station_temperature'') | float(65)) %}{%- set pts = [[40, 0.6], [60, 1.0], [80, 1.0], [95, 1.2]] %}{%- set x = t %}{%- set ns = namespace(y=pts[0][1]) %}{%- for i in range(pts | count) %}{%- if x >= pts[i][0] %}{% set ns.y = pts[i][1] %}{% endif %}{%- if i > 0 and pts[i - 1][0] <= x < pts[i][0] %}{%- set ns.y = pts[i - 1][1] + (x - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]) * (pts[i][1] - pts[i - 1][1]) %}{%- endif %}{%- endfor %}{{ ns.y | round(2) }}'
    attributes:
      average_temperature: '{%- set t = states(''sensor.garden_outdoor_temperature_24h'') | float(states(''sensor.station_temperature'') | float(65)) %}{{ t | round(1) }}'
      season: '{%- set t = states(''sensor.garden_outdoor_temperature_24h'') | float(states(''sensor.station_temperature'') | float(65)) %}{{ ''Dormant'' if t < 45 else ''Cool, slow growth'' if t < 60 else ''Growing'' if t <= 80 else ''Hot, drinks more'' }}'
  - name: Garden 1 Moisture
    unique_id: garden_1_moisture
    icon: mdi:water-percent
    unit_of_measurement: '%'
    device_class: moisture
    state_class: measurement
    availability: '{{ (states.sensor | map(attribute=''entity_id'') | select(''search'', ''soil_moisture_1$'') | map(''states'') | select(''is_number'') | list) | count > 0 }}'
    state: '{{ (states.sensor | map(attribute=''entity_id'') | select(''search'', ''soil_moisture_1$'') | map(''states'') | select(''is_number'') | list) | first }}'
  - name: Garden 1 Soil Temperature
    unique_id: garden_1_soil_temperature
    icon: mdi:thermometer
    unit_of_measurement: °F
    device_class: temperature
    state_class: measurement
    availability: '{{ (states.sensor | map(attribute=''entity_id'') | select(''search'', ''soil_temperature_1$'') | map(''states'') | select(''is_number'') | list) | count > 0 }}'
    state: '{{ (states.sensor | map(attribute=''entity_id'') | select(''search'', ''soil_temperature_1$'') | map(''states'') | select(''is_number'') | list) | first }}'
  - name: Garden 1 Conductivity
    unique_id: garden_1_conductivity
    icon: mdi:flash-outline
    unit_of_measurement: µS/cm
    device_class: conductivity
    state_class: measurement
    availability: '{{ (states.sensor | map(attribute=''entity_id'') | select(''search'', ''soil_(electrical_conductivity|ec)_1$'') | map(''states'') | select(''is_number'') | list) | count > 0 }}'
    state: '{{ (states.sensor | map(attribute=''entity_id'') | select(''search'', ''soil_(electrical_conductivity|ec)_1$'') | map(''states'') | select(''is_number'') | list) | first }}'
