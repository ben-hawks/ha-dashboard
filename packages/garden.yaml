    state: '{{ (states.sensor | map(attribute=''entity_id'') | select(''search'', ''soil_battery_1$'') | map(''states'') | select(''is_number'') | list) | first }}'
  - name: Garden 1 Name
    unique_id: garden_1_name
    icon: mdi:sprout
    state: '{% set n = states(''input_text.garden_1_name'') | trim %}{{ n if n not in ['''', ''unknown'', ''unavailable''] else ''Bed 1'' }}'
