    state: '{%- set base = {''Seedling'': [30, 70], ''Lettuce'': [35, 70], ''Tomato'': [30, 65], ''Pepper'': [30, 65], ''Carrot'': [30, 65], ''Herbs'': [25, 60], ''Cucumber'': [35, 75], ''Strawberry'': [35, 70], ''Blueberry'': [40, 75], ''Raspberry'': [35, 70], ''Sunflower'': [25, 60], ''Flowers'': [30, 70], ''Succulent'': [10, 40]}.get(states(''input_select.garden_1_plant''), [30, 70]) %}{%- set where = ''outdoor'' if is_state(''input_boolean.garden_1_outdoors'', ''on'') else ''indoor'' %}{%- set f = states(''sensor.garden_'' ~ where ~ ''_season'') | float(1) %}{%- set dry = (base[0] * f) | round(0) | int %}{%- set wet = [[(base[1] * f) | round(0) | int, 95] | min, dry + 15] | max %}{%- set m = states(''sensor.garden_1_moisture'') | float(0) %}{{ ''Dry'' if m < dry else ''Wet'' if m > wet else ''Good'' }}'
