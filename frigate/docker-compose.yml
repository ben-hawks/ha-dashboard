# Frigate NVR for the chicken cameras, on the server with the Intel Arc card.
# Source: github.com/ben-hawks/ha-dashboard, frigate/
#
# Copy this folder to the server, fill in .env (from .env.example), then:
#   docker compose up -d
# In Portainer: Stacks > Add stack, paste this file, and load the filled-in
# .env under "Environment variables", with CONFIG_PATH set to the folder
# holding config.yml.
# Web UI: http://<server>:8971, plain http as TLS is off in config.yml. The
# admin password is in the log on first start. See docs/frigate.md.

services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.18.2
    restart: unless-stopped
    stop_grace_period: 30s
    # Frigate's frame cache. Their formula gives about 40 MB per 720p camera
    # plus 50 MB for logs; 256 MB leaves room. "Bus error" in the log means
    # raise it.
    shm_size: "256mb"
    devices:
      # All GPUs, so the Arc is in there even if the server also has an
      # integrated GPU (then the Arc is usually renderD129, not renderD128).
      - /dev/dri:/dev/dri
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_PATH:-./config}:/config
      - ${STORAGE_PATH:-./storage}:/media/frigate
      - type: tmpfs # recording segments are cached in memory before they're written
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971" # web UI and API, logs in
      - "8554:8554" # camera restreams (Home Assistant's live view uses these)
      - "8555:8555/tcp" # WebRTC live view
      - "8555:8555/udp"
    # Listed one by one rather than with env_file, so they come from .env
    # with the docker compose command and from the stack's environment
    # variables in Portainer. A missing one stops the deploy with its name.
    environment:
      FRIGATE_PROTECT_HOST: ${FRIGATE_PROTECT_HOST:?is missing, see .env.example}
      FRIGATE_CAM1_HIGH: ${FRIGATE_CAM1_HIGH:?is missing, see .env.example}
      FRIGATE_CAM1_MEDIUM: ${FRIGATE_CAM1_MEDIUM:?is missing, see .env.example}
      FRIGATE_CAM2_HIGH: ${FRIGATE_CAM2_HIGH:?is missing, see .env.example}
      FRIGATE_CAM2_MEDIUM: ${FRIGATE_CAM2_MEDIUM:?is missing, see .env.example}
      FRIGATE_RUN_HIGH: ${FRIGATE_RUN_HIGH:?is missing, see .env.example}
      FRIGATE_RUN_MEDIUM: ${FRIGATE_RUN_MEDIUM:?is missing, see .env.example}
      FRIGATE_MQTT_HOST: ${FRIGATE_MQTT_HOST:?is missing, see .env.example}
      FRIGATE_MQTT_USER: ${FRIGATE_MQTT_USER:?is missing, see .env.example}
      FRIGATE_MQTT_PASSWORD: ${FRIGATE_MQTT_PASSWORD:?is missing, see .env.example}
