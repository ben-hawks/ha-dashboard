# Mirror of drip-pump.yaml in the HA ESPHome Device Builder (source of truth is the ESPHome dashboard).
# Source: github.com/ben-hawks/ha-dashboard, esphome/drip-pump.yaml
# API key omitted here; the dashboard copy has it.
#
# Garden drip pump: Athom ESP32-C3 US smart plug (V3) powering the Vivosun
# drip kit's pump. Home Assistant decides when and how long it runs
# (packages/drip.yaml, generated by tools/garden.py; see docs/drip.md).
# Imports Athom's official config and only overrides what a pump needs.
#
# Safety, so a lost connection or a Home Assistant restart can't flood the
# beds or empty the reservoir:
#   - the plug turns itself off after max_run, however it was turned on
#     (HA, the web page or the button);
#   - after a power cut or reboot it comes back OFF;
#   - the button still works (it's handy to prime the lines), within max_run.
# Keep max_run equal to DRIP["failsafe"] in tools/garden.py.

substitutions:
  name: drip-pump
  friendly_name: Drip Pump
  room: Garden
  timezone: America/Chicago
  power_plug_type: power-socket-us
  # Power every 5 s, so HA can tell within ~30 s if the pump isn't drawing
  # anything (unplugged from the plug, or dead).
  sensor_update_interval: 5s
  relay_restore_mode: ALWAYS_OFF
  max_run: 15min

packages:
  athom: github://athom-tech/esp32-configs/athom-smart-plug.yaml

esphome:
  name_add_mac_suffix: false

api:
  encryption:
    key: !secret drip_pump_api_key   # dashboard copy has the literal key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Drip Pump Fallback Hotspot
    password: !secret fallback_ap_password

globals:
  # Athom's power-on behaviour: 1 = Always Off (2 = Always On, 3 = Restore).
  - id: !extend restore_mode
    initial_value: "1"

select:
  # Not something to change from HA: the pump must start off.
  - id: !extend power_mode
    disabled_by_default: true

switch:
  - id: !extend relay
    on_turn_on:
      - script.execute: failsafe_off
    on_turn_off:
      - script.stop: failsafe_off

script:
  # Restarts each time the relay turns on; turns it off after max_run.
  - id: failsafe_off
    mode: restart
    then:
      - delay: ${max_run}
      - logger.log: "Drip pump ran for ${max_run}: failsafe off"
      - switch.turn_off: relay
