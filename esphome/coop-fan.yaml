# Coop exhaust fan: ESP32-WROOM-32E 4-relay board + SHT40 probe.
# Source: github.com/ben-hawks/ha-dashboard, esphome/coop-fan.yaml
#
# The fan decides for itself, on the board, so it keeps working if Wi-Fi or
# Home Assistant is down:
#   - Too hot:   runs at "Cool down above" (default 85 °F) and stops 3 °F below.
#   - Too damp:  runs at "Dry out above" (default 70 %) and stops 5 % below.
#                Damp air in a cold coop is what causes frostbite on combs.
#                Only when venting would actually dry the coop: the coop air
#                must hold at least "Inside wetter than outside by" (default
#                10 %) more water than the outside air (the weather station,
#                read from Home Assistant), and it stops once that drops 5 %
#                lower. Compared as absolute humidity (grams of water per m³),
#                not RH: cold outside air at 90 % RH can still be far drier
#                than a coop at 70 %. If Home Assistant or the station isn't
#                available, this check is skipped (the plain rule above).
#   - Too cold:  it won't run for dampness below "Don't vent below" (default
#                15 °F), so it doesn't pull freezing drafts over the hens.
#   - Sensor problem (no reading for 2 minutes): it falls back to the last
#                good temperature: on if that was hot, otherwise off.
#                "Sensor problem" turns on in HA.
#
# Home Assistant gets temperature, humidity, the fan, why it's on or off
# ("Fan status"), a mode (Auto / On / Off) and the thresholds. Switching the
# fan by hand puts it in On or Off mode; after "Manual mode lasts" hours
# (default 4, 0 = until changed) it goes back to Auto.
#
# Wiring
#   Relay 1 (GPIO32)  exhaust fan: fan + to NO1, supply + to COM1, both minus
#                     wires straight together. Relays 2-4 (GPIO33, 25, 26)
#                     are spare and hidden in HA until enabled.
#   SHT40 probe       VCC to 3V3 (not 5V), GND to GND, SDA to GPIO21, SCL to
#                     GPIO22 on the pin header. Check the probe's wire
#                     colours against its label; cheap probes vary. Mount it
#                     tip-down, out of pecking reach, and leave the vent hole
#                     in the tip open.
#   Power             The 7-30V input can share the fan's 12 V or 24 V supply.
#                     Use either that or N/L mains, not both.
#
# The copy in the ESPHome add-on has its own API key in place of
# !secret coop_fan_api_key (the "New device" wizard made it). Wi-Fi and the
# setup hotspot use the add-on's existing secrets.

substitutions:
  name: coop-fan
  friendly_name: Coop Fan
  hot_hysteresis_f: "3"
  damp_hysteresis_pct: "5"
  # Outside air, from Home Assistant (tools/weather.py's station sensors).
  outside_temperature: sensor.station_temperature   # °F
  outside_humidity: sensor.station_humidity         # %
  # Outside readings older than this count as unavailable.
  outside_max_age_ms: "1800000"                     # 30 min
  drier_hysteresis_pct: "5"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: evaluate

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret coop_fan_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If it can't join Wi-Fi it makes its own network for setup.
  ap:
    ssid: Coop Fan Setup
    password: !secret fallback_ap_password

captive_portal:

globals:
  # When the sensor last reported, to notice if it stops.
  - id: last_reading
    type: uint32_t
    initial_value: "0"
  # When the mode last left Auto, for "Manual mode lasts".
  - id: manual_since
    type: uint32_t
    initial_value: "0"
  # Last good temperature in °F, for when the sensor drops out.
  - id: last_good_f
    type: float
    initial_value: "NAN"
  # When an outside reading last arrived from Home Assistant.
  - id: last_outside
    type: uint32_t
    initial_value: "0"

# ---------------------------------------------------------------------------
# Relays
# ---------------------------------------------------------------------------
switch:
  - platform: gpio
    id: fan_relay
    pin: GPIO32
    internal: true
    restore_mode: ALWAYS_OFF

  # The fan as Home Assistant sees it. Flipping it switches to On/Off mode.
  - platform: template
    name: Exhaust fan
    icon: mdi:fan
    lambda: return id(fan_relay).state;
    turn_on_action:
      - select.set:
          id: fan_mode
          option: "On"
    turn_off_action:
      - select.set:
          id: fan_mode
          option: "Off"

  - platform: gpio
    name: Relay 2
    pin: GPIO33
    restore_mode: ALWAYS_OFF
    disabled_by_default: true
  - platform: gpio
    name: Relay 3
    pin: GPIO25
    restore_mode: ALWAYS_OFF
    disabled_by_default: true
  - platform: gpio
    name: Relay 4
    pin: GPIO26
    restore_mode: ALWAYS_OFF
    disabled_by_default: true

# ---------------------------------------------------------------------------
# Sensors
# ---------------------------------------------------------------------------
i2c:
  sda: GPIO21
  scl: GPIO22

sensor:
  - platform: sht4x
    update_interval: 30s
    # The built-in heater dries the sensor after condensation (a cold coop
    # full of warm, damp hen breath). It pulses on a fixed schedule; kept
    # gentle: low power, 1 s at a time, about 1% of the time. Readings just
    # after a pulse run warm/dry, so the median of the last three is used.
    heater_power: Low
    heater_time: Long
    heater_max_duty: 0.01
    temperature:
      id: coop_temp
      name: Temperature
      filters:
        - median:
            window_size: 3
            send_every: 1
            send_first_at: 1
      on_value:
        - lambda: id(last_reading) = millis();
        - script.execute: evaluate
    humidity:
      id: coop_humidity
      name: Humidity
      filters:
        - median:
            window_size: 3
            send_every: 1
            send_first_at: 1
      on_value:
        - component.update: coop_ah
        - component.update: wetter_inside
        - script.execute: evaluate

  # Outside air from Home Assistant. Internal: they're HA's own sensors.
  - platform: homeassistant
    id: outside_temp_f
    entity_id: ${outside_temperature}
    internal: true
    on_value:
      - lambda: id(last_outside) = millis();
      - component.update: outside_ah
      - component.update: wetter_inside
  - platform: homeassistant
    id: outside_rh
    entity_id: ${outside_humidity}
    internal: true
    on_value:
      - lambda: id(last_outside) = millis();
      - component.update: outside_ah
      - component.update: wetter_inside

  # Water in the air, g/m³ (Magnus formula), inside and out, and how much
  # wetter the coop is: what the drying check compares.
  - platform: template
    id: coop_ah
    name: Coop absolute humidity
    icon: mdi:water
    unit_of_measurement: "g/m³"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 30s
    lambda: |-
      float t = id(coop_temp).state, rh = id(coop_humidity).state;
      if (isnan(t) || isnan(rh)) return NAN;
      return 6.112f * expf(17.67f * t / (t + 243.5f)) * rh * 2.1674f / (273.15f + t);
  - platform: template
    id: outside_ah
    name: Outside absolute humidity
    icon: mdi:water-outline
    unit_of_measurement: "g/m³"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 30s
    lambda: |-
      if (id(last_outside) == 0 || millis() - id(last_outside) > ${outside_max_age_ms} ||
          !api::global_api_server->is_connected()) return NAN;
      float t = (id(outside_temp_f).state - 32.0f) / 1.8f, rh = id(outside_rh).state;
      if (isnan(t) || isnan(rh)) return NAN;
      return 6.112f * expf(17.67f * t / (t + 243.5f)) * rh * 2.1674f / (273.15f + t);
  - platform: template
    id: wetter_inside
    name: Coop air wetter than outside
    icon: mdi:water-plus
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 30s
    lambda: |-
      float ai = id(coop_ah).state, ao = id(outside_ah).state;
      if (isnan(ai) || isnan(ao) || ao < 0.1f) return NAN;
      return (ai / ao - 1.0f) * 100.0f;

  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

binary_sensor:
  - platform: template
    name: Sensor problem
    device_class: problem
    # No reading for 2 minutes (4 missed updates), or never since boot.
    lambda: |-
      return id(last_reading) == 0 || millis() - id(last_reading) > 120000 ||
             isnan(id(coop_temp).state) || isnan(id(coop_humidity).state);

text_sensor:
  - platform: template
    id: fan_status
    name: Fan status
    icon: mdi:information-outline

# ---------------------------------------------------------------------------
# Settings (remembered across restarts)
# ---------------------------------------------------------------------------
select:
  - platform: template
    id: fan_mode
    name: Fan mode
    icon: mdi:fan-auto
    options: ["Auto", "On", "Off"]
    initial_option: "Auto"
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          if (i != 0) id(manual_since) = millis();
      - script.execute: evaluate

number:
  - platform: template
    id: hot_on
    name: Cool down above
    icon: mdi:thermometer-high
    entity_category: config
    unit_of_measurement: "°F"
    min_value: 60
    max_value: 100
    step: 1
    initial_value: 85
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: evaluate
  - platform: template
    id: damp_on
    name: Dry out above
    icon: mdi:water-percent
    entity_category: config
    unit_of_measurement: "%"
    min_value: 40
    max_value: 95
    step: 1
    initial_value: 70
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: evaluate
  - platform: template
    id: min_vent
    name: Don't vent below
    icon: mdi:snowflake-thermometer
    entity_category: config
    unit_of_measurement: "°F"
    min_value: -20
    max_value: 50
    step: 1
    initial_value: 15
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: evaluate
  - platform: template
    id: drier_by
    name: Inside wetter than outside by
    icon: mdi:water-plus-outline
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: evaluate
  - platform: template
    id: manual_hours
    name: Manual mode lasts
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: h
    min_value: 0
    max_value: 24
    step: 1
    initial_value: 4
    optimistic: true
    restore_value: true

# Re-check every 30 s too, for "Manual mode lasts".
interval:
  - interval: 30s
    then:
      - script.execute: evaluate

# ---------------------------------------------------------------------------
# The fan logic
# ---------------------------------------------------------------------------
script:
  - id: evaluate
    mode: queued
    max_runs: 3
    then:
      - lambda: |-
          auto idx = id(fan_mode).active_index();
          size_t mode = idx.has_value() ? *idx : 0;   // 0 Auto, 1 On, 2 Off

          // Manual mode times out back to Auto.
          float hours = id(manual_hours).state;
          if (mode != 0 && hours > 0 &&
              millis() - id(manual_since) > (uint32_t) (hours * 3600000.0f)) {
            auto call = id(fan_mode).make_call();
            call.set_option("Auto");
            call.perform();   // runs this script again, in Auto
            return;
          }

          bool on = id(fan_relay).state;
          bool want;
          std::string why;
          float c = id(coop_temp).state;
          float rh = id(coop_humidity).state;

          if (mode == 1) {
            want = true;
            why = "On (manual)";
          } else if (mode == 2) {
            want = false;
            why = "Off (manual)";
          } else if (id(last_reading) == 0 || millis() - id(last_reading) > 120000 ||
                     isnan(c) || isnan(rh)) {
            // No reading: run only if it was hot when we last knew.
            float f = id(last_good_f);
            want = !isnan(f) && f >= id(hot_on).state - ${hot_hysteresis_f};
            why = want ? "On (sensor problem, was hot)" : "Off (sensor problem)";
          } else {
            float f = c * 1.8f + 32.0f;
            id(last_good_f) = f;
            bool hot = on ? f > id(hot_on).state - ${hot_hysteresis_f}
                          : f >= id(hot_on).state;
            bool too_cold = f < id(min_vent).state;
            bool damp = on ? rh > id(damp_on).state - ${damp_hysteresis_pct}
                           : rh >= id(damp_on).state;
            // Would outside air dry it? Only known while HA and the station
            // are reachable; otherwise assume yes (the plain rule).
            float wetter = id(wetter_inside).state;   // NAN without outside air
            bool known = !isnan(wetter);
            bool drier_out = !known ||
                (on ? wetter > id(drier_by).state - ${drier_hysteresis_pct}
                    : wetter >= id(drier_by).state);
            want = hot || (damp && drier_out && !too_cold);
            if (hot) why = "On (too hot)";
            else if (want) why = known ? "On (drying out)" : "On (drying out, no outside reading)";
            else if (damp && !drier_out) why = "Off (damp, but outside air isn't drier)";
            else if (damp) why = "Off (damp, but too cold to vent)";
            else why = "Off (comfortable)";
          }

          if (want != on) {
            if (want) id(fan_relay).turn_on();
            else id(fan_relay).turn_off();
          }
          if (id(fan_status).state != why) id(fan_status).publish_state(why);
