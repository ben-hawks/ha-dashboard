    high: '{%- set raw = (daily.values() | list | first).forecast %}{%- if raw and raw[0].is_daytime is defined %}{%- set ns = namespace(days=[]) %}{%- for f in raw if f.is_daytime %}{%- set i = raw.index(f) %}{%- set night = raw[i + 1] if i + 1 < raw | count else none %}{%- set ns.days = ns.days + [dict(f, templow=night.temperature) if night and not night.is_daytime else dict(f)] %}{%- endfor %}{%- set days = ns.days %}{%- else %}{%- set days = raw %}{%- endif %}{{ days[4].temperature | round(0) | int }}°'
    low: '{%- set raw = (daily.values() | list | first).forecast %}{%- if raw and raw[0].is_daytime is defined %}{%- set ns = namespace(days=[]) %}{%- for f in raw if f.is_daytime %}{%- set i = raw.index(f) %}{%- set night = raw[i + 1] if i + 1 < raw | count else none %}{%- set ns.days = ns.days + [dict(f, templow=night.temperature) if night and not night.is_daytime else dict(f)] %}{%- endfor %}{%- set days = ns.days %}{%- else %}{%- set days = raw %}{%- endif %}{{ (days[4].templow | round(0) | int) ~ ''°'' if days[4].templow is defined and days[4].templow is not none else '''' }}'
- name: Forecast Cache
  unique_id: forecast_cache
  icon: mdi:weather-cloudy-clock
  device_class: timestamp
  state: '{{ now().isoformat() }}'
  attributes:
    source: '{{ hourly.keys() | list | first }}'
    hourly: '{%- set hours = (hourly.values() | list | first).forecast %}{{ hours[:24] }}'
    daily: '{%- set raw = (daily.values() | list | first).forecast %}{%- if raw and raw[0].is_daytime is defined %}{%- set ns = namespace(days=[]) %}{%- for f in raw if f.is_daytime %}{%- set i = raw.index(f) %}{%- set night = raw[i + 1] if i + 1 < raw | count else none %}{%- set ns.days = ns.days + [dict(f, templow=night.temperature) if night and not night.is_daytime else dict(f)] %}{%- endfor %}{%- set days = ns.days %}{%- else %}{%- set days = raw %}{%- endif %}{{ days[:7] }}'
binary_sensor:
- name: Stormy Weather
  unique_id: stormy_weather
  icon: mdi:weather-lightning-rainy
  state: '{%- set hours = (hourly.values() | list | first).forecast %}{% set stormy = [''rainy'', ''pouring'', ''lightning'', ''lightning-rainy'', ''hail'', ''snowy'', ''snowy-rainy'', ''exceptional''] %}{% set soon = hours[:3] | map(attribute=''condition'') | list %}{{ states(hourly.keys() | list | first) in stormy or states(''sensor.station_sky'') in [''Rain'', ''Snow''] or soon | select(''in'', stormy) | list | count > 0 }}'
  attributes:
    next_hours: '{%- set hours = (hourly.values() | list | first).forecast %}{{ hours[:3] | map(attribute=''condition'') | join('', '') }}'
