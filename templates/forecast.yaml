# GENERATED by tools/weather.py: edit it and re-run, don't edit this
# file by hand.
triggers:
- trigger: time_pattern
  minutes: /30
- trigger: homeassistant
  event: start
- trigger: event
  event_type: event_template_reloaded
- trigger: state
  entity_id:
  - weather.forecast_home
  - sensor.station_sky
  to: null
conditions:
- condition: template
  value_template: '{%- set nws = integration_entities(''nws'') | select(''match'', ''weather\.'') | first | default('''') %}{{ (nws and has_value(nws)) or has_value(''weather.forecast_home'') }}'
actions:
- variables:
    source: '{%- set nws = integration_entities(''nws'') | select(''match'', ''weather\.'') | first | default('''') %}{%- set source = nws if nws and has_value(nws) else ''weather.forecast_home'' %}{{ source }}'
- action: weather.get_forecasts
  target:
    entity_id: '{{ source }}'
  data:
    type: hourly
  response_variable: hourly
- action: weather.get_forecasts
  target:
    entity_id: '{{ source }}'
  data:
    type: '{{ ''daily'' if source == ''weather.forecast_home'' else ''twice_daily'' }}'
  response_variable: daily
