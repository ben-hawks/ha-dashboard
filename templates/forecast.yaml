# GENERATED by tools/weather.py: edit it and re-run, don't edit this
# file by hand.
triggers:
- trigger: time_pattern
  minutes: /30
- trigger: homeassistant
  event: start
- trigger: event
  event_type: event_template_reloaded
actions:
- action: weather.get_forecasts
  target:
    entity_id: weather.forecast_home
  data:
    type: hourly
  response_variable: hourly
- action: weather.get_forecasts
  target:
    entity_id: weather.forecast_home
  data:
    type: daily
  response_variable: daily
sensor:
- name: Forecast Hourly
  unique_id: forecast_hourly
  icon: mdi:weather-partly-cloudy
  device_class: timestamp
  state: '{{ now().isoformat() }}'
  attributes:
    forecast: '{{ hourly[''weather.forecast_home''].forecast[:12] }}'
- name: Forecast Daily
  unique_id: forecast_daily
  icon: mdi:weather-partly-cloudy
  device_class: timestamp
  state: '{{ now().isoformat() }}'
  attributes:
    forecast: '{{ daily[''weather.forecast_home''].forecast[:12] }}'
